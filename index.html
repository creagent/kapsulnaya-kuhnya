нения: коул-слоу 41, азиатская тарелка 42, начинка шаурмы 04; краснокочанный вариант — салат 65. Одна партия даёт две порции по 350 г и небольшой остаток на начинку, а не все варианты сразу.", "time": "15 минут", "source": "Клетчатка, с. 7–8", "recipes": [{"id": "n01", "code": "41", "name": "Коул-слоу с йогуртовой заправкой", "time": "5 минут", "ingredients": "капустная основа Л 350 г; йогурт 80 г; горчица 5 г; лимонный сок 10 мл; укроп 10 г", "body": "Смешать йогурт, горчицу и лимон. Заправить основу непосредственно перед подачей, добавить укроп. Подать к тефтелям, рыбе или лепёшкам. Это салат-дополнение, а не самостоятельный белковый ужин. Аллергены: молоко, горчица.", "source": "Клетчатка, с. 7–8", "refs": ["p1"], "kind": "salad", "servings": "На двоих", "html": "<p>Смешать йогурт, горчицу и лимон. Заправить основу непосредственно перед подачей, добавить укроп. Подать к тефтелям, рыбе или лепёшкам. Это салат-дополнение, а не самостоятельный белковый ужин. Аллергены: молоко, горчица.<\/p>", "raw": "капустная основа Л 350 г; йогурт 80 г; горчица 5 г; лимонный сок 10 мл; укроп 10 г\nСмешать йогурт, горчицу и лимон. Заправить основу непосредственно перед подачей, добавить укроп. Подать к тефтелям, рыбе или лепёшкам. Это салат-дополнение, а не самостоятельный белковый ужин. Аллергены: молоко, горчица.", "ingredientList": ["капустная основа Л 350 г", "йогурт 80 г", "горчица 5 г", "лимонный сок 10 мл", "укроп 10 г"], "base": "p1", "baseIds": ["p1"]}, {"id": "n02", "code": "42", "name": "Азиатская тарелка с капустой и яйцами", "time": "12–15 минут", "ingredients": "капустная основа Л 350 г; готовый рис 300 г; яйца 4 шт.; соус С7 40 мл; арахис 20 г; масло 5 г", "body": "Рис прогреть до 74 °C; использовать только правильно охлаждённый рис не старше суток или своевременно замороженную порцию. Яйца приготовить на сковороде до схватывания. Разложить рис, свежую капусту и яйца, полить соусом и посыпать арахисом. Яйца можно заменить 250 г готовых креветок по инструкции на упаковке. Аллергены: яйца, арахис, соя, кунжут, возможна пшеница; при замене — ракообразные.", "source": "Клетчатка, с. 8", "refs": ["p1", "s7"], "kind": "recipe", "servings": "На двоих", "html": "<p>Рис прогреть до 74 °C; использовать только правильно охлаждённый рис не старше суток или своевременно замороженную порцию. Яйца приготовить на сковороде до схватывания. Разложить рис, свежую капусту и яйца, полить соусом и посыпать арахисом. Яйца можно заменить 250 г готовых креветок по инструкции на упаковке. Аллергены: яйца, арахис, соя, кунжут, возможна пшеница; при замене — ракообразные.<\/p>", "raw": "капустная основа Л 350 г; готовый рис 300 г; яйца 4 шт.; соус С7 40 мл; арахис 20 г; масло 5 г\nРис прогреть до 74 °C; использовать только правильно охлаждённый рис не старше суток или своевременно замороженную порцию. Яйца приготовить на сковороде до схватывания. Разложить рис, свежую капусту и яйца, полить соусом и посыпать арахисом. Яйца можно заменить 250 г готовых креветок по инструкции на упаковке. Аллергены: яйца, арахис, соя, кунжут, возможна пшеница; при замене — ракообразные.", "ingredientList": ["капустная основа Л 350 г", "готовый рис 300 г", "яйца 4 шт", "соус С7 40 мл", "арахис 20 г", "масло 5 г"], "base": "p1", "baseIds": ["p1"]}, {"id": "l7", "code": "65", "name": "Красная капуста с яблоком", "time": "5–10 минут из готовых компонентов", "ingredients": "краснокочанная капуста 300 г; яблоко 150 г; укроп 10 г; лимонный сок 15 мл; масло 10 г", "body": "Капусту нашинковать и слегка размять перед подачей. Добавить яблоко соломкой, укроп, лимон и масло.", "source": "План, с. 19", "refs": [], "kind": "salad", "servings": "На двоих, салат-дополнение", "html": "<p>Капусту нашинковать и слегка размять перед подачей. Добавить яблоко соломкой, укроп, лимон и масло.<\/p>", "raw": "краснокочанная капуста 300 г; яблоко 150 г; укроп 10 г; лимонный сок 15 мл; масло 10 г\nКапусту нашинковать и слегка размять перед подачей. Добавить яблоко соломкой, укроп, лимон и масло.", "ingredientList": ["краснокочанная капуста 300 г", "яблоко 150 г", "укроп 10 г", "лимонный сок 15 мл", "масло 10 г"], "base": "p1", "baseIds": ["p1"]}, {"id": "r04", "code": "04", "name": "Домашняя шаурма с курицей", "time": "10–12 минут", "body": "1. Курицу прогреть со специями и 2 ст. л. воды. Овощи тонко нарезать.\n2. На лаваш нанести соус, добавить начинку и овощи, плотно завернуть.\n3. По желанию подсушить швом вниз на сухой сковороде. Соус и помидоры добавлять непосредственно перед сборкой, чтобы лаваш не размок.\n\n**Изменение основы:** свежие овощи и аромат специй. Аллергены: пшеница, молоко.", "ingredients": "курица 300 г; 2 порции тонкого лаваша по 60–70 г; капуста 200 г; огурец 150 г; помидоры 150 г; соус С1 100 г; паприка и зира по ¼ ч. л.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; 2 порции тонкого лаваша по 60–70 г; капуста 200 г; огурец 150 г; помидоры 150 г; соус С1 100 г; паприка и зира по ¼ ч. л.\n1. Курицу прогреть со специями и 2 ст. л. воды. Овощи тонко нарезать.\n2. На лаваш нанести соус, добавить начинку и овощи, плотно завернуть.\n3. По желанию подсушить швом вниз на сухой сковороде. Соус и помидоры добавлять непосредственно перед сборкой, чтобы лаваш не размок.\n\n**Изменение основы:** свежие овощи и аромат специй. Аллергены: пшеница, молоко.", "html": "<ol><li>Курицу прогреть со специями и 2 ст. л. воды. Овощи тонко нарезать.<\/li><li>На лаваш нанести соус, добавить начинку и овощи, плотно завернуть.<\/li><li>По желанию подсушить швом вниз на сухой сковороде. Соус и помидоры добавлять непосредственно перед сборкой, чтобы лаваш не размок.<\/li><\/ol>\n<p><strong>Изменение основы:<\/strong> свежие овощи и аромат специй. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["курица 300 г", "2 порции тонкого лаваша по 60–70 г", "капуста 200 г", "огурец 150 г", "помидоры 150 г", "соус С1 100 г", "паприка и зира по ¼ ч. л"], "refs": [], "baseIds": ["b1", "p1"]}, {"id": "r02", "code": "02", "name": "Кесадилья с курицей и капустным салатом", "time": "12–15 минут", "body": "1. Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.\n2. Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.\n3. Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.\n\n**Изменение основы:** хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.", "ingredients": "курица 300 г; 2 большие тортильи; сыр 60 г; томатная основа К 60 г или пассата; паприка ½ ч. л.; капуста 250 г; йогуртовый соус С1 80 г; лимонный сок 10 мл.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; 2 большие тортильи; сыр 60 г; томатная основа К 60 г или пассата; паприка ½ ч. л.; капуста 250 г; йогуртовый соус С1 80 г; лимонный сок 10 мл.\n1. Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.\n2. Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.\n3. Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.\n\n**Изменение основы:** хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.", "html": "<ol><li>Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.<\/li><li>Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.<\/li><li>Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.<\/li><\/ol>\n<p><strong>Изменение основы:<\/strong> хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["курица 300 г", "2 большие тортильи", "сыр 60 г", "томатная основа К 60 г или пассата", "паприка ½ ч. л", "капуста 250 г", "йогуртовый соус С1 80 г", "лимонный сок 10 мл"], "refs": [], "baseIds": ["b1", "p1"]}, {"id": "r34", "code": "34", "name": "Рыбные тако с капустой", "time": "12–15 минут", "body": "Капусту тонко нашинковать, слегка размять с лимоном. Рыбу небольшими кусочками посыпать паприкой, обжарить до готовности. Тортильи согреть, наполнить рыбой, капустой, помидорами и соусом. Собирать перед едой. Дополнительные аллергены: пшеница в пшеничных тортильях, молоко.", "ingredients": "рыба 320 г; 4 маленькие тортильи; капуста 250 г; помидоры 200 г; соус С1 100 г; паприка ½ ч. л.; масло 10 г; лимонный сок 10 мл.", "kind": "recipe", "base": "b9", "raw": "рыба 320 г; 4 маленькие тортильи; капуста 250 г; помидоры 200 г; соус С1 100 г; паприка ½ ч. л.; масло 10 г; лимонный сок 10 мл.\nКапусту тонко нашинковать, слегка размять с лимоном. Рыбу небольшими кусочками посыпать паприкой, обжарить до готовности. Тортильи согреть, наполнить рыбой, капустой, помидорами и соусом. Собирать перед едой. Дополнительные аллергены: пшеница в пшеничных тортильях, молоко.", "html": "<p>Капусту тонко нашинковать, слегка размять с лимоном. Рыбу небольшими кусочками посыпать паприкой, обжарить до готовности. Тортильи согреть, наполнить рыбой, капустой, помидорами и соусом. Собирать перед едой. Дополнительные аллергены: пшеница в пшеничных тортильях, молоко.<\/p>", "ingredientList": ["рыба 320 г", "4 маленькие тортильи", "капуста 250 г", "помидоры 200 г", "соус С1 100 г", "паприка ½ ч. л", "масло 10 г", "лимонный сок 10 мл"], "refs": [], "baseIds": ["b9", "p1"]}], "iconIndex": 10, "html": "<p>Белокочанная капуста 600 г; морковь 250 г. Выход около 850 г. Вымыть овощи, хорошо обсушить, капусту тонко нашинковать, морковь натереть. Хранить без соли и заправки; зелень вымыть и обсушить отдельно, добавлять при подаче.<\/p>\n<p>В этой системе планировать на 48 часов в холодильнике при ≤4 °C. Не замораживать для хрустящего салата.<\/p>\n<p>Применения: коул-слоу 41, азиатская тарелка 42, начинка шаурмы 04; краснокочанный вариант — салат 65. Одна партия даёт две порции по 350 г и небольшой остаток на начинку, а не все варианты сразу.<\/p>", "svg": "\n\n<svg width=\"160\" height=\"160\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 160 160\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\t<title>...<\/title>\n\t<desc>...<\/desc>\n\t<clipPath id=\"clip\">\n\t\t<rect x=\"0\" y=\"0\" width=\"160\" height=\"160\"/>\n\t<\/clipPath>\n\t<g id=\"group\" transform=\"scale(1,-1) translate(0,-160)\" style=\"clip-path: url(#clip)\">\n\t\t<g transform=\"\">\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"72\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(90%,92%,84%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"58\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(100%,98%,96%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"50\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(95%,93%,87%); fill-rule: evenodd;\"/>\n\t\t\t<path d=\"M 48,49 L 61,64 Z\" style=\"stroke: rgb(48%,58%,35%); stroke-linecap: butt; stroke-width: 5;\"/>\n\t\t\t<path d=\"M 63,49 L 76,64 Z\" style=\"stroke: rgb(72%,78%,56%); stroke-linecap: butt; stroke-width: 5;\"/>\n\t\t\t<path d=\"M 78,49 L 91,64 Z\" style=\"stroke: rgb(81%,58%,36%); stroke-linecap: butt; stroke-width: 5;\"/>\n\t\t\t<path d=\"M 93,49 L 106,64 Z\" style=\"stroke: rgb(48%,58%,35%); stroke-linecap: butt; stroke-width: 5;\"/>\n\t\t\t<path d=\"M 108,49 L 121,64 Z\" style=\"stroke: rgb(72%,78%,56%); stroke-linecap: butt; stroke-width: 5;\"/>\n\t\t\t<path d=\"M 48,67 L 61,82 Z\" style=\"stroke: rgb(81%,58%,36%); stroke-linecap: butt; stroke-width: 5;\"/>\n\t\t\t<path d=\"M 63,67 L 76,82 Z\" style=\"stroke: rgb(48%,58%,35%); stroke-linecap: butt; stroke-width: 5;\"/>\n\t\t\t<path d=\"M 78,67 L 91,82 Z\" style=\"stroke: rgb( 3.", "time": "15–20 минут", "source": "Клетчатка, с. 9–10", "recipes": [{"id": "n03", "code": "43", "name": "Тосты с фасолевым кремом и овощами", "time": "8–10 минут", "ingredients": "основа М 350 г; хлеб цельнозерновой 140 г; помидоры 200 г; огурец 150 г; зелень 15 г", "body": "Фасоль измельчить до густого крема, при необходимости добавить ложку воды. Хлеб подсушить. Намазать крем, сверху выложить нарезанные овощи и зелень. Крем можно подать холодным при правильном хранении или тщательно прогреть отдельно. Аллергены: пшеница; молоко, если в фасоли была сырная корка.", "source": "Клетчатка, с. 9–10", "refs": ["p2"], "kind": "recipe", "servings": "На двоих", "html": "<p>Фасоль измельчить до густого крема, при необходимости добавить ложку воды. Хлеб подсушить. Намазать крем, сверху выложить нарезанные овощи и зелень. Крем можно подать холодным при правильном хранении или тщательно прогреть отдельно. Аллергены: пшеница; молоко, если в фасоли была сырная корка.<\/p>", "raw": "основа М 350 г; хлеб цельнозерновой 140 г; помидоры 200 г; огурец 150 г; зелень 15 г\nФасоль измельчить до густого крема, при необходимости добавить ложку воды. Хлеб подсушить. Намазать крем, сверху выложить нарезанные овощи и зелень. Крем можно подать холодным при правильном хранении или тщательно прогреть отдельно. Аллергены: пшеница; молоко, если в фасоли была сырная корка.", "ingredientList": ["основа М 350 г", "хлеб цельнозерновой 140 г", "помидоры 200 г", "огурец 150 г", "зелень 15 г"], "base": "p2", "baseIds": ["p2"]}, {"id": "n04", "code": "44", "name": "Тёплый фасолевый дип к печёным овощам", "time": "10–12 минут", "ingredients": "основа М 350 г; овощи Е 400 г; вода 40–70 мл; паприка ½ ч. л.; хлеб 100 г по аппетиту", "body": "Измельчить фасоль с водой, прогреть с паприкой до 74 °C. Овощи разогреть отдельно, хлеб подсушить. Подать дип в миске, а овощи и хлеб рядом. Количество воды подбирать по густоте основы. Аллергены: пшеница при подаче хлеба; молоко при сырной корке.", "source": "Клетчатка, с. 10", "refs": ["p2", "b6"], "kind": "recipe", "servings": "На двоих", "html": "<p>Измельчить фасоль с водой, прогреть с паприкой до 74 °C. Овощи разогреть отдельно, хлеб подсушить. Подать дип в миске, а овощи и хлеб рядом. Количество воды подбирать по густоте основы. Аллергены: пшеница при подаче хлеба; молоко при сырной корке.<\/p>", "raw": "основа М 350 г; овощи Е 400 г; вода 40–70 мл; паприка ½ ч. л.; хлеб 100 г по аппетиту\nИзмельчить фасоль с водой, прогреть с паприкой до 74 °C. Овощи разогреть отдельно, хлеб подсушить. Подать дип в миске, а овощи и хлеб рядом. Количество воды подбирать по густоте основы. Аллергены: пшеница при подаче хлеба; молоко при сырной корке.", "ingredientList": ["основа М 350 г", "овощи Е 400 г", "вода 40–70 мл", "паприка ½ ч. л", "хлеб 100 г по аппетиту"], "base": "p2", "baseIds": ["p2", "b6"]}, {"id": "n05", "code": "45", "name": "Паста с белой фасолью и лимоном", "time": "12–15 минут", "ingredients": "основа М 350 г; сухая паста 160 г; шпинат 150 г; вода от пасты 100–150 мл; лимонный сок 10 мл; помидоры 200 г", "body": "Сварить пасту. Фасоль измельчить, развести водой от варки, прогреть и добавить шпинат. Смешать с пастой и довести готовую основу до 74 °C. После снятия с огня добавить лимон, помидоры подать рядом. Аллергены: пшеница; молоко при сырной корке.", "source": "Клетчатка, с. 10", "refs": ["p2"], "kind": "recipe", "servings": "На двоих", "html": "<p>Сварить пасту. Фасоль измельчить, развести водой от варки, прогреть и добавить шпинат. Смешать с пастой и довести готовую основу до 74 °C. После снятия с огня добавить лимон, помидоры подать рядом. Аллергены: пшеница; молоко при сырной корке.<\/p>", "raw": "основа М 350 г; сухая паста 160 г; шпинат 150 г; вода от пасты 100–150 мл; лимонный сок 10 мл; помидоры 200 г\nСварить пасту. Фасоль измельчить, развести водой от варки, прогреть и добавить шпинат. Смешать с пастой и довести готовую основу до 74 °C. После снятия с огня добавить лимон, помидоры подать рядом. Аллергены: пшеница; молоко при сырной корке.", "ingredientList": ["основа М 350 г", "сухая паста 160 г", "шпинат 150 г", "вода от пасты 100–150 мл", "лимонный сок 10 мл", "помидоры 200 г"], "base": "p2", "baseIds": ["p2"]}, {"id": "r23", "code": "23", "name": "Крем-суп из печёных овощей и белой фасоли", "time": "12–15 минут", "body": "Овощи и фасоль залить жидкостью, довести до кипения и прогреть 5–7 минут. Снять с огня и измельчить погружным блендером, не разбрызгивая горячую жидкость. При необходимости добавить воды, вернуть к кипению. Добавить лимон и масло; подать с тостами. Фасоль даёт кремовую текстуру без обязательных сливок. Аллергены: пшеница в хлебе; состав бульона.", "ingredients": "овощи 400 г; консервированная белая фасоль 300 г; вода или бульон 500 мл; лимонный сок 10 мл; масло 5 г; хлеб 100 г.", "kind": "recipe", "base": "b6", "raw": "овощи 400 г; консервированная белая фасоль 300 г; вода или бульон 500 мл; лимонный сок 10 мл; масло 5 г; хлеб 100 г.\nОвощи и фасоль залить жидкостью, довести до кипения и прогреть 5–7 минут. Снять с огня и измельчить погружным блендером, не разбрызгивая горячую жидкость. При необходимости добавить воды, вернуть к кипению. Добавить лимон и масло; подать с тостами. Фасоль даёт кремовую текстуру без обязательных сливок. Аллергены: пшеница в хлебе; состав бульона.", "html": "<p>Овощи и фасоль залить жидкостью, довести до кипения и прогреть 5–7 минут. Снять с огня и измельчить погружным блендером, не разбрызгивая горячую жидкость. При необходимости добавить воды, вернуть к кипению. Добавить лимон и масло; подать с тостами. Фасоль даёт кремовую текстуру без обязательных сливок. Аллергены: пшеница в хлебе; состав бульона.<\/p>", "ingredientList": ["овощи 400 г", "консервированная белая фасоль 300 г", "вода или бульон 500 мл", "лимонный сок 10 мл", "масло 5 г", "хлеб 100 г"], "refs": [], "baseIds": ["b6", "p2"]}, {"id": "r26", "code": "26", "name": "Грибной соус с белой фасолью", "time": "12–15 минут", "body": "Прогреть грибы с фасолью и водой, затем вмешать сметану и горчицу. Несколько фасолин размять для густоты и полностью прогреть блюдо. Крупу разогреть отдельно. Подать с тонко нашинкованной капустой. Аллергены: молоко, горчица; пшеница при использовании булгура.", "ingredients": "грибы 250 г; белая фасоль 300 г; сметана 15% 80 г; вода 100 мл; горчица 5 г; готовый булгур или гречка 250 г; капуста 200 г.", "kind": "recipe", "base": "b7", "raw": "грибы 250 г; белая фасоль 300 г; сметана 15% 80 г; вода 100 мл; горчица 5 г; готовый булгур или гречка 250 г; капуста 200 г.\nПрогреть грибы с фасолью и водой, затем вмешать сметану и горчицу. Несколько фасолин размять для густоты и полностью прогреть блюдо. Крупу разогреть отдельно. Подать с тонко нашинкованной капустой. Аллергены: молоко, горчица; пшеница при использовании булгура.", "html": "<p>Прогреть грибы с фасолью и водой, затем вмешать сметану и горчицу. Несколько фасолин размять для густоты и полностью прогреть блюдо. Крупу разогреть отдельно. Подать с тонко нашинкованной капустой. Аллергены: молоко, горчица; пшеница при использовании булгура.<\/p>", "ingredientList": ["грибы 250 г", "белая фасоль 300 г", "сметана 15% 80 г", "вода 100 мл", "горчица 5 г", "готовый булгур или гречка 250 г", "капуста 200 г"], "refs": [], "baseIds": ["b7", "p2"]}], "iconIndex": 11, "html": "<p>Готовая белая фасоль без жидкости 720 г; вода или овощной бульон 180–220 мл; чеснок 1 зубчик; масло 10 г; лимонный сок 15 мл. Выход примерно 850–900 г. Прогреть чеснок с маслом, добавить фасоль и жидкость, томить 8–10 минут. Лимон добавить в конце. Часть оставить целой, часть измельчить.<\/p>\n<p>По желанию: 15–20 г чистой съедобной корки твёрдого сыра без воска, пластика и плесени положить при томлении, затем вынуть. При таком варианте присутствует молоко; соль добавлять после пробы.<\/p>\n<p>Остудить быстро, хранить до 48 часов либо заморозить порциями. Для короткого рецепта используется уже сваренная или консервированная фасоль, не сухая. Применения: тосты 43, дип 44, соус к о перед жаркой. Аллерген: молоко; возможен глютен.", "time": "5 минут + 8–12 часов в холодильнике", "source": "Клетчатка, с. 11", "recipes": [{"id": "n08", "code": "З7", "name": "Оладьи из овсяной основы", "time": "18–25 минут", "ingredients": "овсяная основа Н 560 г; яйца 2 шт.; рисовая мука 60 г; разрыхлитель ½ ч. л.; масло 10 г; ягоды 150 г", "body": "К холодной основе добавить яйца, муку и разрыхлитель, перемешать. На большой сковороде жарить небольшие тонкие оладьи партиями по 2–3 минуты с каждой стороны, до полной готовности в центре. Если тесто жидкое, дать постоять 5 минут или добавить немного муки. Подать с ягодами. Время замачивания основы считается отдельно. Аллергены: яйца, молоко; возможен глютен.", "source": "Клетчатка, с. 11", "refs": ["p3"], "kind": "breakfast", "servings": "На двоих", "html": "<p>К холодной основе добавить яйца, муку и разрыхлитель, перемешать. На большой сковороде жарить небольшие тонкие оладьи партиями по 2–3 минуты с каждой стороны, до полной готовности в центре. Если тесто жидкое, дать постоять 5 минут или добавить немного муки. Подать с ягодами. Время замачивания основы считается отдельно. Аллергены: яйца, молоко; возможен глютен.<\/p>", "raw": "овсяная основа Н 560 г; яйца 2 шт.; рисовая мука 60 г; разрыхлитель ½ ч. л.; масло 10 г; ягоды 150 г\nК холодной основе добавить яйца, муку и разрыхлитель, перемешать. На большой сковороде жарить небольшие тонкие оладьи партиями по 2–3 минуты с каждой стороны, до полной готовности в центре. Если тесто жидкое, дать постоять 5 минут или добавить немного муки. Подать с ягодами. Время замачивания основы считается отдельно. Аллергены: яйца, молоко; возможен глютен.", "ingredientList": ["овсяная основа Н 560 г", "яйца 2 шт", "рисовая мука 60 г", "разрыхлитель ½ ч. л", "масло 10 г", "ягоды 150 г"], "base": "p3", "baseIds": ["p3"]}], "iconIndex": 12, "html": "<p>Хлопья, подходящие для замачивания, 120 г; натуральный йогурт 200 г; молоко 240 мл. Перемешать и сразу убрать в закрытой ёмкости в холодильник. Выход около 560 г — один завтрак на двоих. Сироп не обязателен; сладость можно добавить фруктами при подаче.<\/p>\n<p>Использовать на следующее утро, ориентир хранения — до 24 часов и не позже срока ингредиентов. Взять либо всю основу с ягодами/фруктами, либо всю основу для оладий З7. Сырое яйцо добавлять только перед жаркой. Аллерген: молоко; возможен глютен.<\/p>", "svg": "\n\n<svg width=\"160\" height=\"160\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 160 160\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\t<title>...<\/title>\n\t<desc>...<\/desc>\n\t<clipPath id=\"clip\">\n\t\t<rect x=\"0\" y=\"0\" width=\"160\" height=\"160\"/>\n\t<\/clipPath>\n\t<g id=\"group\" transform=\"scale(1,-1) translate(0,-160)\" style=\"clip-path: url(#clip)\">\n\t\t<g transform=\"\">\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"72\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(93%,89%,82%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"58\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(100%,98%,96%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"50\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(95%,93%,87%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"43\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(82%,72%,57%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"80.0\" cy=\"80.0\" rx=\"4.0\" ry=\"2.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(96%,89%,77%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"75.35047526246971\" cy=\"84.34533309598861\" rx=\"4.0\" ry=\"2.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(96%,89%,77%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"80.60803568218047\" cy=\"71.02056278995195\" rx=\"4.0\" ry=\"2.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: ; stroke-linecap: butt; stroke-width: 2; fill: rgb(58%,41%,49%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"57\" cy=\"70\" r=\"5\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(58%,41%,49%); fill-rule: evenodd;\"/>\n\t\t<\/g>\n\t<\/g>\n<\/svg>\n"}, {"id": "p4", "letter": "О", "name": "Нарезка сельдерея и кольраби", "short": "Корнеплоды", "role": "Овощной компонент", "color": "#E8E0EB", "intro": "Очищенный корень сельдерея 300 г; очищенная кольраби 300 г. Сельдерей нарезать тонкой соломкой, кольраби — ломтиками толщиной 3–4 мм. Вымыть до нарезки, обсушить, хранить в отдельных закрытых контейнерах. Сельдерей можно слегка сбрызнуть лимоном от потемнения; это не продлевает срок хранения.\n\nПланировать использование за 48 часов в холодильнике. Сельдерей идёт в ремулад 46, кольраби — в гарнир 47; оба продукта можно добавить к противню Е. Если не нравится сельдерей, заменить морковью с другим вкусом и текстурой. Аллерген: сельдерей.", "time": "15 минут", "source": "Клетчатка, с. 12", "recipes": [{"id": "n06", "code": "46", "name": "Ремулад из корня сельдерея", "time": "8–10 минут", "ingredients": "сельдерей из О 300 г; яблоко 150 г; йогурт 70 г; горчица 5 г; лимонный сок 15 мл; петрушка 10 г", "body": "Яблоко нарезать соломкой. Смешать йогурт, горчицу и лимон, соединить с сельдереем, яблоком и петрушкой. Подать к птице, рыбе или картофелю. Аллергены: сельдерей, молоко, горчица.", "source": "Клетчатка, с. 12", "refs": ["p4"], "kind": "salad", "servings": "На двоих", "html": "<p>Яблоко нарезать соломкой. Смешать йогурт, горчицу и лимон, соединить с сельдереем, яблоком и петрушкой. Подать к птице, рыбе или картофелю. Аллергены: сельдерей, молоко, горчица.<\/p>", "raw": "сельдерей из О 300 г; яблоко 150 г; йогурт 70 г; горчица 5 г; лимонный сок 15 мл; петрушка 10 г\nЯблоко нарезать соломкой. Смешать йогурт, горчицу и лимон, соединить с сельдереем, яблоком и петрушкой. Подать к птице, рыбе или картофелю. Аллергены: сельдерей, молоко, горчица.", "ingredientList": ["сельдерей из О 300 г", "яблоко 150 г", "йогурт 70 г", "горчица 5 г", "лимонный сок 15 мл", "петрушка 10 г"], "base": "p4", "baseIds": ["p4"]}, {"id": "n07", "code": "47", "name": "Кольраби с лимоном и петрушкой", "time": "15–20 минут", "ingredients": "кольраби из О 300 г; сливочное масло 10 г; вода 70 мл; чеснок ½ зубчика; лимонный сок 10 мл; петрушка 10 г", "body": "Ломтики кольраби положить на сковороду с маслом и водой. Готовить под крышкой 8–12 минут до мягкости, затем выпарить лишнюю воду. Добавить чеснок на 30 секунд, снять с огня и вмешать лимон с петрушкой. Подать как овощной гарнир; старой плотной кольраби нужно больше времени. Аллерген: молоко.", "source": "Клетчатка, с. 12", "refs": ["p4"], "kind": "recipe", "servings": "На двоих", "html": "<p>Ломтики кольраби положить на сковороду с маслом и водой. Готовить под крышкой 8–12 минут до мягкости, затем выпарить лишнюю воду. Добавить чеснок на 30 секунд, снять с огня и вмешать лимон с петрушкой. Подать как овощной гарнир; старой плотной кольраби нужно больше времени. Аллерген: молоко.<\/p>", "raw": "кольраби из О 300 г; сливочное масло 10 г; вода 70 мл; чеснок ½ зубчика; лимонный сок 10 мл; петрушка 10 г\nЛомтики кольраби положить на сковороду с маслом и водой. Готовить под крышкой 8–12 минут до мягкости, затем выпарить лишнюю воду. Добавить чеснок на 30 секунд, снять с огня и вмешать лимон с петрушкой. Подать как овощной гарнир; старой плотной кольраби нужно больше времени. Аллерген: молоко.", "ingredientList": ["кольраби из О 300 г", "сливочное масло 10 г", "вода 70 мл", "чеснок ½ зубчика", "лимонный сок 10 мл", "петрушка 10 г"], "base": "p4", "baseIds": ["p4"]}], "iconIndex": 13, "html": "<p>Очищенный корень сельдерея 300 г; очищенная кольраби 300 г. Сельдерей нарезать тонкой соломкой, кольраби — ломтиками толщиной 3–4 мм. Вымыть до нарезки, обсушить, хранить в отдельных закрытых контейнерах. Сельдерей можно слегка сбрызнуть лимоном от потемнения; это не продлевает срок хранения.<\/p>\n<p>Планировать использование за 48 часов в холодильнике. Сельдерей идёт в ремулад 46, кольраби — в гарнир 47; оба продукта можно добавить к противню Е. Если не нравится сельдерей, заменить морковью с другим вкусом и текстурой. Аллерген: сельдерей.<\/p>", "svg": "\n\n<svg width=\"160\" height=\"160\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 160 160\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\t<title>...<\/title>\n\t<desc>...<\/desc>\n\t<clipPath id=\"clip\">\n\t\t<rect x=\"0\" y=\"0\" width=\"160\" height=\"160\"/>\n\t<\/clipPath>\n\t<g id=\"group\" transform=\"scale(1,-1) translate(0,-160)\" style=\"clip-path: url(#clip)\">\n\t\t<g transform=\"\">\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"72\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(90%,87%,92%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"58\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(100%,98%,96%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"50\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(95%,93%,87%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"61\" cy=\"74\" r=\"24\" style=\"stroke: rgb(48%,58%,35%); stroke-linecap: butt; stroke-width: 2; fill: rgb(76%,80%,63%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"100\" cy=\"78\" r=\"23\" style=\"stroke: rgb(58%,49%,61%); stroke-linecap: butt; stroke-width: 2; fill: rgb(77%,67%,78%); fill-rule: evenodd;\"/>\n\t\t\t<path d=\"M 50,91 L 46,116 Z\" style=\"stroke: rgb(43%,54%,34%); stroke-linecap: butt; stroke-width: 4;\"/>\n\t\t\t<path d=\"M 61,91 L 57,116 Z\" style=\"stroke: rgb(43%,54%,34%); stroke-linecap: butt; stroke-width: 4;\"/>\n\t\t\t<path d=\"M 71,91 L 67,116 Z\" style=\"stroke: rgb(43%,54%,34%); stroke-linecap: butt; stroke-width: 4;\"/>\n\t\t\t<path d=\"M 91,95 L 98,118 Z\" style=\"stroke: rgb(43%,54%,34%); stroke-linecap: butt; stroke-width: 4;\"/>\n\t\t\t<path d=\"M 101,95 L 108,118 Z\" style=\"stroke: rgb(43%,54%,34%); stroke-linecap: butt; stroke-width: 4;\"/>\n\t\t\t<path d=\"M 110,95 L 117,118 Z\" style=\"stroke: rgb(43%,54%,34%); stroke-linecap: butt; stroke-width: 4;\"/>\n\t\t<\/g>\n\t<\/g>\n<\/svg>\n"}], "recipes": [{"id": "r01", "code": "01", "name": "Лимонная паста с курицей и шпинатом", "time": "12–15 минут", "body": "1. Сварить пасту. Одновременно прогреть курицу со сливками и 80 мл воды от пасты.\n2. Добавить шпинат на 1–2 минуты, затем пасту. Прогреть основу насквозь.\n3. Выключить огонь, вмешать сыр, лимон и при необходимости ещё немного воды. Подать с нарезанными помидорами.\n\n**Изменение основы:** сочная эмульсия и свежая кислота; сливочный сыр не обязателен. Аллергены: пшеница, молоко.", "ingredients": "курица 300 г; сухая паста с варкой 8–10 минут 160 г; шпинат 150 г; сливки 10% 80 мл; твёрдый сыр 20 г; лимонный сок 10 мл; вода от пасты 80–120 мл; помидоры 250 г для подачи.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; сухая паста с варкой 8–10 минут 160 г; шпинат 150 г; сливки 10% 80 мл; твёрдый сыр 20 г; лимонный сок 10 мл; вода от пасты 80–120 мл; помидоры 250 г для подачи.\n1. Сварить пасту. Одновременно прогреть курицу со сливками и 80 мл воды от пасты.\n2. Добавить шпинат на 1–2 минуты, затем пасту. Прогреть основу насквозь.\n3. Выключить огонь, вмешать сыр, лимон и при необходимости ещё немного воды. Подать с нарезанными помидорами.\n\n**Изменение основы:** сочная эмульсия и свежая кислота; сливочный сыр не обязателен. Аллергены: пшеница, молоко.", "html": "<ol><li>Сварить пасту. Одновременно прогреть курицу со сливками и 80 мл воды от пасты.<\/li><li>Добавить шпинат на 1–2 минуты, затем пасту. Прогреть основу насквозь.<\/li><li>Выключить огонь, вмешать сыр, лимон и при необходимости ещё немного воды. Подать с нарезанными помидорами.<\/li><\/ol>\n<p><strong>Изменение основы:<\/strong> сочная эмульсия и свежая кислота; сливочный сыр не обязателен. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["курица 300 г", "сухая паста с варкой 8–10 минут 160 г", "шпинат 150 г", "сливки 10% 80 мл", "твёрдый сыр 20 г", "лимонный сок 10 мл", "вода от пасты 80–120 мл", "помидоры 250 г для подачи"], "refs": [], "baseIds": ["b1"]}, {"id": "r02", "code": "02", "name": "Кесадилья с курицей и капустным салатом", "time": "12–15 минут", "body": "1. Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.\n2. Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.\n3. Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.\n\n**Изменение основы:** хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.", "ingredients": "курица 300 г; 2 большие тортильи; сыр 60 г; томатная основа К 60 г или пассата; паприка ½ ч. л.; капуста 250 г; йогуртовый соус С1 80 г; лимонный сок 10 мл.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; 2 большие тортильи; сыр 60 г; томатная основа К 60 г или пассата; паприка ½ ч. л.; капуста 250 г; йогуртовый соус С1 80 г; лимонный сок 10 мл.\n1. Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.\n2. Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.\n3. Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.\n\n**Изменение основы:** хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.", "html": "<ol><li>Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.<\/li><li>Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе у, аккуратно перемешать и довести тефтели до нужной температуры. Гречку разогреть отдельно с ложкой воды. Подать со свежим огурцом. Дополнительные аллергены: молоко, горчица.<\/p>", "ingredientList": ["8 тефтелей", "грибная основа Ж 200 г", "готовая гречка 300 г", "сметана 15% 70 г", "вода 100 мл", "горчица 5 г", "огурец 300 г для подачи"], "refs": [], "baseIds": ["b2"]}, {"id": "r09", "code": "09", "name": "Быстрое рагу к пасте", "time": "12–15 минут", "body": "Сварить пасту. Параллельно прогреть фарш с томатом, орегано и 50 мл воды. В конце добавить шпинат и пасту, при необходимости воду от варки. Подать с небольшим количеством сыра и огурцом. Это быстрый соус на готовой основе, а не обещание классического долго томлённого болоньезе за 15 минут. Аллергены: пшеница, молоко.", "ingredients": "мясная основа 300 г; томатная основа К 250 г; сухая паста 160 г; шпинат 100 г; сыр 20 г; сушёный орегано ½ ч. л.; огурец 200 г.", "kind": "recipe", "base": "b3", "raw": "мясная основа 300 г; томатная основа К 250 г; сухая паста 160 г; шпинат 100 г; сыр 20 г; сушёный орегано ½ ч. л.; огурец 200 г.\nСварить пасту. Параллельно прогреть фарш с томатом, орегано и 50 мл воды. В конце добавить шпинат и пасту, при необходимости воду от варки. Подать с небольшим количеством сыра и огурцом. Это быстрый соус на готовой основе, а не обещание классического долго томлённого болоньезе за 15 минут. Аллергены: пшеница, молоко.", "html": "<p>Сварить пасту. Параллельно прогреть фарш с томатом, орегано и 50 мл воды. В конце добавить шпинат и пасту, при необходимости воду от варки. Подать с небольшим количеством сыра и огурцом. Это быстрый соус на готовой основе, а не обещание классического долго томлённого болоньезе за 15 минут. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["мясная основа 300 г", "томатная основа К 250 г", "сухая паста 160 г", "шпинат 100 г", "сыр 20 г", "сушёный орегано ½ ч. л", "огурец 200 г"], "refs": [], "baseIds": ["b3"]}, {"id": "r10", "code": "10", "name": "Чили с фасолью", "time": "12–15 минут", "body": "Смешать фарш, фасоль, томат, кукурузу и специи; добавить 80–100 мл воды. Довести до кипения и прогреть 7–10 минут, помешивая. Пока готовится, нашинковать капусту; подать её отдельно, йогурт добавить в тарелку. При большом аппетите дополнить хлебом. Аллерген: молоко.", "ingredients": "мясная основа 300 г; консервированная фасоль 240 г; томатная основа К 250 г; кукуруза 80 г; паприка 1 ч. л.; зира ½ ч. л.; йогурт 60 г; капуста 250 г.", "kind": "recipe", "base": "b3", "raw": "мясная основа 300 г; консервированная фасоль 240 г; томатная основа К 250 г; кукуруза 80 г; паприка 1 ч. л.; зира ½ ч. л.; йогурт 60 г; капуста 250 г.\nСмешать фарш, фасоль, томат, кукурузу и специи; добавить 80–100 мл воды. Довести до кипения и прогреть 7–10 минут, помешивая. Пока готовится, нашинковать капусту; подать её отдельно, йогурт добавить в тарелку. При большом аппетите дополнить хлебом. Аллерген: молоко.", "html": "<p>Смешать фарш, фасоль, томат, кукурузу и специи; добавить 80–100 мл воды. Довести до кипения и прогреть 7–10 минут, помешивая. Пока готовится, нашинковать капусту; подать её отдельно, йогурт добавить в тарелку. При большом аппетите дополнить хлебом. Аллерген: молоко.<\/p>", "ingredientList": ["мясная основа 300 г", "консервированная фасоль 240 г", "томатная основа К 250 г", "кукуруза 80 г", "паприка 1 ч. л", "зира ½ ч. л", "йогурт 60 г", "капуста 250 г"], "refs": [], "baseIds": ["b3"]}, {"id": "r11", "code": "11", "name": "Тёплый тако-салат", "time": "10–12 минут", "body": "Фарш и фасоль прогреть с паприкой и ложкой воды. Тортильи нарезать полосками и быстро подсушить на второй сковороде. В тарелках соединить листья и нарезанные овощи, сверху выложить горячую начинку, соус и хрустящие полоски. Собирать только перед едой. Аллергены: пшеница, молоко в С6.", "ingredients": "мясная основа 300 г; готовая фасоль 180 г; 2 тортильи; салатные листья 80 г; помидоры 250 г; огурец 150 г; соус С6 80 г; паприка ½ ч. л.", "kind": "salad", "base": " ми около 2 см. Тушить на небольшом огне до готовности рыбы и полного прогрева овощей; не перемешивать резко. Добавить лимон. Дополнительный аллерген: пшеница; проверить состав карри.", "html": "<p>Приготовить кускус. В широкой сковороде довести до кипения томат, кокосовое молоко, воду и карри. Добавить овощи и рыбу кубиками около 2 см. Тушить на небольшом огне до готовности рыбы и полного прогрева овощей; не перемешивать резко. Добавить лимон. Дополнительный аллерген: пшеница; проверить состав карри.<\/p>", "ingredientList": ["рыба 320 г", "печёные овощи Е 250 г", "томатная основа К 150 г", "кокосовое молоко 100 мл", "вода 100 мл", "карри 1 ч. л", "сухой кускус 100 г", "лимон 10 мл сока"], "refs": [], "baseIds": ["b9"]}, {"id": "r36", "code": "36", "name": "Рыба с лапшой и имбирным соусом", "time": "12–15 минут", "body": "Лапшу сварить. Рыбу обжарить небольшими порциями, добавить морковь тонкими лентами; в конце влить смесь соевого соуса, лимона, имбиря и воды. Довести рыбу до готовности. Соединить с лапшой, свежий огурец добавить при подаче. Дополнительные аллергены: соя, часто пшеница, опционально кунжут.", "ingredients": "рыба 320 г; сухая соба/другая лапша с варкой до 7 минут 140 г; морковь 150 г; огурец 200 г; соевый соус 15 мл; лимонный сок 10 мл; имбирь 5 г; масло 10 г; вода 30 мл; кунжут 5 г по желанию.", "kind": "recipe", "base": "b9", "raw": "рыба 320 г; сухая соба/другая лапша с варкой до 7 минут 140 г; морковь 150 г; огурец 200 г; соевый соус 15 мл; лимонный сок 10 мл; имбирь 5 г; масло 10 г; вода 30 мл; кунжут 5 г по желанию.\nЛапшу сварить. Рыбу обжарить небольшими порциями, добавить морковь тонкими лентами; в конце влить смесь соевого соуса, лимона, имбиря и воды. Довести рыбу до готовности. Соединить с лапшой, свежий огурец добавить при подаче. Дополнительные аллергены: соя, часто пшеница, опционально кунжут.", "html": "<p>Лапшу сварить. Рыбу обжарить небольшими порциями, добавить морковь тонкими лентами; в конце влить смесь соевого соуса, лимона, им
