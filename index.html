льшую форму и запекать при 180 °C около 40–50 минут до схватывания; ориентир для запеканки — 74 °C в центре. Время нагрева духовки включено в оценку. Псиллиум здесь для текстуры: учитывать свойства продукта; это не рекомендация принимать добавку для набора нормы клетчатки. Быстро охладить порционно, хранить до 48 часов либо заморозить. Аллергены: молоко, яйца, пшеница.", "ingredientList": ["творог 540 г", "яичные белки 2 шт", "молоко 120 мл", "цельнозерновая мука 30 г", "псиллиум 5 г", "мёд или сироп 15 г по желанию", "цедра 1 ч. л"], "baseIds": []}, {"id": "n22", "code": "З10", "name": "Сырники: сладкий и солёный вариант", "time": "20–25 минут", "ingredients": "сухой творог 360 г; желток 1 шт.; цельнозерновая мука 25–35 г и немного для обваливания; масло 10 г; йогурт 100 г; ягоды 150 г для сладкой подачи", "body": "Смешать творог, желток и муку, сформовать 6 небольших сырников. Жарить на умеренном огне до полной готовности внутри, при необходимости закончить под крышкой. Для солёного варианта вместо ягод взять 30 г тёртого сыра и 10 г зелени в массу, подать с овощами. Сырники для запаса можно заморозить сырыми поштучно: подписать «сырые» и готовить полностью после размораживания в холодильнике. Аллергены: молоко, яйца, пшеница.", "source": "План, с. 17–18", "refs": [], "kind": "breakfast", "servings": "На двоих", "html": "<p>Смешать творог, желток и муку, сформовать 6 небольших сырников. Жарить на умеренном огне до полной готовности внутри, при необходимости закончить под крышкой. Для солёного варианта вместо ягод взять 30 г тёртого сыра и 10 г зелени в массу, подать с овощами. Сырники для запаса можно заморозить сырыми поштучно: подписать «сырые» и готовить полностью после размораживания в холодильнике. Аллергены: молоко, яйца, пшеница.<\/p>", "raw": "сухой творог 360 г; желток 1 шт.; цельнозерновая мука 25–35 г и немного для обваливания; масло 10 г; йогурт 100 г; ягоды 150 г для сладкой подачи\nСмешать творог, желток и муку, сформовать 6 небольших сырников. Жарить на умеренном огне до полной готовности внутри, при необходимости закончить под крышкой. Для солёного варианта вместо ягод взять 30 г тёртого сыра и 10 г зелени в массу, подать с овощами. Сырники для запаса можно заморозить сырыми поштучно: подписать «сырые» и готовить полностью после размораживания в холодильнике. Аллергены: молоко, яйца, пшеница.", "ingredientList": ["сухой творог 360 г", "желток 1 шт", "цельнозерновая мука 25–35 г и немного для обваливания", "масло 10 г", "йогурт 100 г", "ягоды 150 г для сладкой подачи"], "baseIds": []}], "notes": [{"title": "Как пользоваться", "body": "Все блюда рассчитаны **на двух взрослых**, если явно не сказано иначе. Указанная масса заготовки, бобовых и гарниров — **готовый продукт**; масса пасты, лапши и кускуса обозначается как сухая. У консервов считается масса без жидкости. Порции можно увеличивать по аппетиту.\n\n**Блюда под одной заготовкой — варианты на выбор.** Если хочется приготовить несколько из них, сложите нужное количество основы и приготовьте соответствующий объём. Не заготавливайте все основы на одну неделю: для начала достаточно двух-трёх.\n\nВремя в каждой карточке указано отдельно. Для быстрых блюд это ориентир от начала финальной сборки до подачи при наличии готовых заготовок, двух конфорок, большой сковороды и заранее размороженных продуктов. Для пасты и кускуса быстро вскипятить воду помогает чайник. С маленькой посудой и при готовке на четверых может понадобиться больше времени. Эти рецептуры составлены для курса и ещё не прошли кухонную отработку; диапазоны времени и выход ориентировочные.\n\nСоль и перец — по вкусу. При использовании сыра, соевого соуса или солёных консервов сначала пробуйте блюдо. 1 ч. л. = 5 мл, 1 ст. л. = 15 мл.\n\n### Общие условия хранения и готовности\n\nДля готовых основ ниже выбран консервативный рабочий срок **до 48 часов при температуре не выше 4 °C**; для рыбы и риса есть отдельные указания. Это срок планирования при правильной обработке и быстром охлаждении, а не гарантия безопасности при любых условиях. Более короткая инструкция производителя имеет приоритет.\n\nОхлаждайте небольшими неглубокими порциями и убирайте в холодильник своевременно; не держите большую кастрюлю на столе до полного остывания. Замораживайте предназначенные для запаса порции в день приготовления после быстрого охлаждения. Примеры замороженных основ здесь планируются к использованию за месяц, чтобы не терять их из виду. Подробный порядок и источники — в разделе 7 [программы курса](#guide).\n\nГорячие блюда с уже приготовленной основой прогревайте до **74 °C внутри**. Птица при первом приготовлении — **74 °C**, говяжий фарш — **71 °C**, свежая рыба — **63 °C**; готовые блюда из яиц без мяса — **71 °C**. Указанное время не заменяет контроль готовности. [Источник: FoodSafety.gov](https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures).\n\nОсновные аллергены обозначены на уровне разделов и соусов: молоко, яйца, пшеница/глютен, рыба, соя, кунжут, арахис, горчица. Всегда учитывать состав упаковки. Соусы ниже взаимозаменяемы по вкусу, но не автоматически при аллергии.", "html": "<p>Все блюда рассчитаны <strong>на двух взрослых<\/strong>, если явно не сказано иначе. Указанная масса заготовки, бобовых и гарниров — <strong>готовый продукт<\/strong>; масса пасты, лапши и кускуса обозначается как сухая. У консервов считается масса без жидкости. Порции можно увеличивать по аппетиту.<\/p>\n<p><strong>Блюда под одной заготовкой — варианты на выбор.<\/strong> Если хочется приготовить несколько из них, сложите нужное количество основы и приготовьте соответствующий объём. Не заготавливайте все основы на одну неделю: для начала достаточно двух-трёх.<\/p>\n<p>Время в каждой карточке указано отдельно. Для быстрых блюд это ориентир от начала финальной сборки до подачи при наличии готовых заготовок, двух конфорок, большой сковороды и заранее размороженных продуктов. Для пасты и кускуса быстро вскипятить воду помогает чайник. С маленькой посудой и при готовке на четверых может понадобиться больше времени. Эти рецептуры составлены для курса и ещё не прошли кухонную отработку; диапазоны времени и выход ориентировочные.<\/p>\n<p>Соль и перец — по вкусу. При использовании сыра, соевого соуса или солёных консервов сначала пробуйте блюдо. 1 ч. л. = 5 мл, 1 ст. л. = 15 мл.<\/p>\n<h3>Общие условия хранения и готовности<\/h3>\n<p>Для готовых основ ниже выбран консервативный рабочий срок <strong>до 48 часов при температуре не выше 4 °C<\/strong>; для рыбы и риса есть отдельные указания. Это срок планирования при правильной обработке и быстром охлаждении, а не гарантия безопасности при любых условиях. Более короткая инструкция производителя имеет приоритет.<\/p>\n<p>Охлаждайте небольшими неглубокими порциями и убирайте в холодильник своевременно; не держите большую кастрюлю на столе до полного остывания. Замораживайте предназначенные для запаса порции в день приготовления после быстрого охлаждения. Примеры замороженных основ здесь планируются к использованию за месяц, чтобы не терять их из виду. Подробный порядок и источники — в разделе 7 <a href=\"#guide\">программы курса<\/a>.<\/p>\n<p>Горячие блюда с уже приготовленной основой прогревайте до <strong>74 °C внутри<\/strong>. Птица при первом приготовлении — <strong>74 °C<\/strong>, говяжий фарш — <strong>71 °C<\/strong>, свежая рыба — <strong>63 °C<\/strong>; готовые блюда из яиц без мяса — <strong>71 °C<\/strong>. Указанное время не заменяет контроль готовности. <a href=\"https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures\">Источник: FoodSafety.gov<\/a>.<\/p>\n<p>Основные аллергены обозначены на уровне разделов и соусов: молоко, яйца, пшеница/глютен, рыба, соя, кунжут, арахис, горчица. Всегда учитывать состав упаковки. Соусы ниже взаимозаменяемы по вкусу, но не автоматически при аллергии.<\/p>"}, {"title": "Гарниры: когда заранее, когда свежими", "body": "| Компонент | Как организовать | Где переиспользовать |\n|---|---|---|\n| Гречка | Сварить по упаковке, быстро охладить порциями по 250–350 г на двоих; использовать в пределах принятого срока 48 часов | Тефтели, грибы с яйцами, тёплый салат |\n| Булгур | Аналогично; не переваривать, хранить без соуса | Рыба, фасоль с грибами, салат с огурцом |\n| Кускус | Часто проще готовить перед едой: выбрать вариант, которому достаточно около 5 минут запаривания | Курица, чечевица карри, тефтели, сыр с овощами |\n| Паста | Для этой системы варить перед подачей; выбрать форму с варкой 7–10 минут | Любой подходящий готовый соус |\n| Рис | Небольшая свежая партия или правильно охлаждённые порции на следующий день/для заморозки | Жареный рис, гарнир к рыбе, суп |\n\nДля риса действуют отдельные рекомендации FSA: быстрое охлаждение, желательно в течение часа, не более суток в холодильнике и однократный разогрев. Для более позднего использования быстро охладить и своевременно заморозить, затем разморозить в холодильнике и тщательно прогреть. [FSA: хранение риса](https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker#rice).", "html": "<div class=\"table-wrap\"><table><thead><tr><th>Компонент<\/th><th>Как организовать<\/th><th>Где переиспользовать<\/th><\/tr><\/thead><tbody><tr><td>Гречка<\/td><td>Сварить по упаковке, быстро охладить порциями по 250–350 г на двоих; использовать в пределах принятого срока 48 часов<\/td><td>Тефтели, грибы с яйцами, тёплый салат<\/td><\/tr><tr><td>Булгур<\/td><td>Аналогично; не переваривать, хранить без соуса<\/td><td>Рыба, фасоль с грибами, салат с огурцом<\/td><\/tr><tr><td>Кускус<\/td><td>Часто проще готовить перед едой: выбрать вариант, которому достаточно около 5 минут запаривания<\/td><td>Курица, чечевица карри, тефтели, сыр с овощами<\/td><\/tr><tr><td>Паста<\/td><td>Для этой системы варить перед подачей; выбрать форму с варкой 7–10 минут<\/td><td>Любой подходящий готовый соус<\/td><\/tr><tr><td>Рис<\/td><td>Небольшая свежая партия или правильно охлаждённые порции на следующий день/для заморозки<\/td><td>Жареный рис, гарнир к рыбе, суп<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Для риса действуют отдельные рекомендации FSA: быстрое охлаждение, желательно в течение часа, не более суток в холодильнике и однократный разогрев. Для более позднего использования быстро охладить и своевременно заморозить, затем разморозить в холодильнике и тщательно прогреть. <a href=\"https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker#rice\">FSA: хранение риса<\/a>.<\/p>"}, {"title": "Замены, которые стоит объяснять в курсе", "body": "| Вместо | Можно использовать | Что меняется |\n|---|---|---|\n| Куриных кусочков | Готовая индейка; для растительного варианта — обжаренный плотный тофу | Тофу требует другой обработки и приправ; не переносить время сырой курицы автоматически |\n| Феты/халуми | Другой подходящий сыр или фасоль/нут | Бобовым нужна отдельная заправка; соль и текстура будут другими |\n| Тахини | Йогуртовый соус при переносимости молока | Получится другой вкус; это не безаллергенная замена по умолчанию |\n| Арахисового соуса | Йогуртовый или зелёный соус с учётом ограничений | Азиатский вкусовой профиль изменится |\n| Дорогой красной рыбы | Минтай/треска без костей | Более постную рыбу особенно важно не пересушивать |\n| Киноа и редких круп | Гречка, булгур, кускус | Булгур и обычный кускус содержат пшеницу; время и количество воды различаются |\n| Домашнего бульона | Вода с подходящими специями либо готовый бульон | Проверить соль и состав |\n| Сухих бобовых | Консервированные | Использовать массу без жидкости; промывать при необходимости |", "html": "<div class=\"table-wrap\"><table><thead><tr><th>Вместо<\/th><th>Можно использовать<\/th><th>Что меняется<\/th><\/tr><\/thead><tbody><tr><td>Куриных кусочков<\/td><td>Готовая индейка; для растительного варианта — обжаренный плотный тофу<\/td><td>Тофу требует другой обработки и приправ; не переносить время сырой курицы автоматически<\/td><\/tr><tr><td>Феты/халуми<\/td><td>Другой подходящий сыр или фасоль/нут<\/td><td>Бобовым нужна отдельная заправка; соль и текстура будут другими<\/td><\/tr><tr><td>Тахини<\/td><td>Йогуртовый соус при переносимости молока<\/td><td>Получится другой вкус; это не безаллергенная замена по умолчанию<\/td><\/tr><tr><td>Арахисового соуса<\/td><td>Йогуртовый или зелёный соус с учётом ограничений<\/td><td>Азиатский вкусовой профиль изменится<\/td><\/tr><tr><td>Дорогой красной рыбы<\/td><td>Минтай/треска без костей<\/td><td>Более постную рыбу особенно важно не пересушивать<\/td><\/tr><tr><td>Киноа и редких круп<\/td><td>Гречка, булгур, кускус<\/td><td>Булгур и обычный кускус содержат пшеницу; время и количество воды различаются<\/td><\/tr><tr><td>Домашнего бульона<\/td><td>Вода с подходящими специями либо готовый бульон<\/td><td>Проверить соль и состав<\/td><\/tr><tr><td>Сухих бобовых<\/td><td>Консервированные<\/td><td>Использовать массу без жидкости; промывать при необходимости<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "Как превратить сборник в работающую привычку", "body": "Выберите одну животную или растительную белковую основу, один овощной компонент и два соуса. Приготовьте из них два разных ужина, замерьте время, оцените вкус на второй день. Следующую основу добавляйте, когда первые удобно встроились в быт. Распечатайте только выбранные карточки; остальные остаются библиотекой вариантов.\n\nМетодический контекст и сравнение подходов: [Downshiftology](https://downshiftology.com/meal-prep-spring-healthy-meal-prep-ideas/), [Love and Lemons](https://www.loveandlemons.com/healthy-meal-prep-ideas/), [Good Food](https://www.bbcgoodfood.com/howto/guide/batch-cooking-beginners). Источники подтверждают подход к подготовке компонентов; конкретные пропорции и сочетания в этом сборнике — предложенные рецептуры для курса.", "html": "<p>Выберите одну животную или растительную белковую основу, один овощной компонент и два соуса. Приготовьте из них два разных ужина, замерьте время, оцените вкус на второй день. Следующую основу добавляйте, когда первые удобно встроились в быт. Распечатайте только выбранные карточки; остальные остаются библиотекой вариантов.<\/p>\n<p>Методический контекст и сравнение подходов: <a href=\"https://downshiftology.com/meal-prep-spring-healthy-meal-prep-ideas/\">Downshiftology<\/a>, <a href=\"https://www.loveandlemons.com/healthy-meal-prep-ideas/\">Love and Lemons<\/a>, <a href=\"https://www.bbcgoodfood.com/howto/guide/batch-cooking-beginners\">Good Food<\/a>. Источники подтверждают подход к подготовке компонентов; конкретные пропорции и сочетания в этом сборнике — предложенные рецептуры для курса.<\/p>"}], "guides": [{"title": "Клетчатка из обычных продуктов", "body": "Держите под рукой несколько доступных источников клетчатки: овсянку, капусту, морковь, свёклу, бобовые и сезонные корнеплоды. Дорогие ягоды, кейл и специальные добавки для этого не обязательны. Овощи можно есть сырыми, запекать, тушить и превращать в супы.\n\nНа завтрак — овсянка или цельнозерновой хлеб и фрукт; к обеду — овощной компонент и бобовые/цельная крупа; к ужину — ещё один овощной компонент. Это подсказка для планирования, а не расчёт суточной нормы.\n\nОриентир ВОЗ для взрослых — не менее 25 г естественной пищевой клетчатки в сутки. Количество клетчатки и масса овощей — разные величины. [ВОЗ](https://www.who.int/news-room/fact-sheets/detail/healthy-diet).\n\nУвеличивать количество клетчатки лучше постепенно, поддерживая достаточное питьё. [NIDDK](https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/eating-diet-nutrition).\n\nВ этом сборнике содержание клетчатки по рецептам не рассчитано. Для собственного подсчёта нужны точные массы ингредиентов и размер порции.\n\nПопробуйте капустную основу Л, белую фасоль М или овсяную основу Н. Из одной фасоли получаются тосты 43, тёплый дип 44 и соус к пасте 45.", "html": "<p>Держите под рукой несколько доступных источников клетчатки: овсянку, капусту, морковь, свёклу, бобовые и сезонные корнеплоды. Дорогие ягоды, кейл и специальные добавки для этого не обязательны. Овощи можно есть сырыми, запекать, тушить и превращать в супы.<\/p>\n<p>На завтрак — овсянка или цельнозерновой хлеб и фрукт; к обеду — овощной компонент и бобовые/цельная крупа; к ужину — ещё один овощной компонент. Это подсказка для планирования, а не расчёт суточной нормы.<\/p>\n<p>Ориентир ВОЗ для взрослых — не менее 25 г естественной пищевой клетчатки в сутки. Количество клетчатки и масса овощей — разные величины. <a href=\"https://www.who.int/news-room/fact-sheets/detail/healthy-diet\">ВОЗ<\/a>.<\/p>\n<p>Увеличивать количество клетчатки лучше постепенно, поддерживая достаточное питьё. <a href=\"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/eating-diet-nutrition\">NIDDK<\/a>.<\/p>\n<p>В этом сборнике содержание клетчатки по рецептам не рассчитано. Для собственного подсчёта нужны точные массы ингредиентов и размер порции.<\/p>\n<p>Попробуйте капустную основу Л, белую фасоль М или овсяную основу Н. Из одной фасоли получаются тосты 43, тёплый дип 44 и соус к пасте 45.<\/p>"}, {"title": "Варианты овощных и белковых основ", "body": "Печёные овощи Е: добавить сезонный вариант из моркови, цветной капусты, брокколи, репы и корня сельдерея. Плотные корнеплоды нарезать тоньше или начать запекать раньше; брокколи проверять раньше остальных овощей. Одно сочетание работает в тёплой тарелке, крем-супе и лепёшке. «Клетчатка», с. 5–6.\n\nТыква: запечь отдельной порцией по способу Е и распределить между супом 50, роллом 58 и салатом 62. Для ужина через несколько дней часть после быстрого охлаждения сразу заморозить. «План», с. 14–15, 19.\n\nТефтели Б: подойдёт также куриный фарш с сыром. Для пробы можно заменить индейку куриным фаршем и добавить 40–50 г тёртого сыра на 800 г фарша, уменьшив соль. Хранить явно как сырые либо как полностью готовые; в базовой системе удобнее довести до 74 °C заранее. «План», с. 10, 13, 18.\n\nОвсяный завтрак З1 уже покрывает идею overnight oats. Основа Н позволяет использовать тот же замес и холодным, и в оладьях З7. Не нужно готовить обе похожие основы одновременно.", "html": "<p>Печёные овощи Е: добавить сезонный вариант из моркови, цветной капусты, брокколи, репы и корня сельдерея. Плотные корнеплоды нарезать тоньше или начать запекать раньше; брокколи проверять раньше остальных овощей. Одно сочетание работает в тёплой тарелке, крем-супе и лепёшке. «Клетчатка», с. 5–6.<\/p>\n<p>Тыква: запечь отдельной порцией по способу Е и распределить между супом 50, роллом 58 и салатом 62. Для ужина через несколько дней часть после быстрого охлаждения сразу заморозить. «План», с. 14–15, 19.<\/p>\n<p>Тефтели Б: подойдёт также куриный фарш с сыром. Для пробы можно заменить индейку куриным фаршем и добавить 40–50 г тёртого сыра на 800 г фарша, уменьшив соль. Хранить явно как сырые либо как полностью готовые; в базовой системе удобнее довести до 74 °C заранее. «План», с. 10, 13, 18.<\/p>\n<p>Овсяный завтрак З1 уже покрывает идею overnight oats. Основа Н позволяет использовать тот же замес и холодным, и в оладьях З7. Не нужно готовить обе похожие основы одновременно.<\/p>"}, {"title": "Время, охлаждение и готовность", "body": "Разделяйте активную работу и полное время. Разогрев духовки, выпекание, отдых теста, охлаждение и размораживание тоже занимают время. Два последовательных режима на одном приборе нельзя считать одновременными. Для каждой карточки ориентируйтесь на её собственное время.\n\nВакуумирование не заменяет охлаждение и не обнуляет срок продукта. Готовые основы планируйте в пределах выбранного срока до 48 часов, рис — не более суток. Сырые продукты и размораживание — в холодильнике.\n\nДля обычной духовки или сковороды ориентир готовности птицы — 74 °C в центре. Для су-вид важны также толщина, время выдержки и быстрое охлаждение: не переносите один режим на любые куски. [FoodSafety.gov](https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures).\n\nГорячий розлив томатного соуса и переворачивание банки не заменяют проверенный процесс консервирования. В этой системе соус быстро охлаждают и хранят в холодильнике либо морозилке. [NCHFP](https://nchfp.uga.edu/how/can/general-information/ensuring-safe-canned-foods/).\n\nСырые креветки обязательно готовят. Просто разморозить можно только продукт, который уже готов к употреблению по маркировке. Для печени на конец недели берите свежую/размороженную порцию либо своевременно замороженную готовую. Яичные блюда удобнее готовить перед едой.", "html": "<p>Разделяйте активную работу и полное время. Разогрев духовки, выпекание, отдых теста, охлаждение и размораживание тоже занимают время. Два последовательных режима на одном приборе нельзя считать одновременными. Для каждой карточки ориентируйтесь на её собственное время.<\/p>\n<p>Вакуумирование не заменяет охлаждение и не обнуляет срок продукта. Готовые основы планируйте в пределах выбранного срока до 48 часов, рис — не более суток. Сырые продукты и размораживание — в холодильнике.<\/p>\n<p>Для обычной духовки или сковороды ориентир готовности птицы — 74 °C в центре. Для су-вид важны также толщина, время выдержки и быстрое охлаждение: не переносите один режим на любые куски. <a href=\"https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures\">FoodSafety.gov<\/a>.<\/p>\n<p>Горячий розлив томатного соуса и переворачивание банки не заменяют проверенный процесс консервирования. В этой системе соус быстро охлаждают и хранят в холодильнике либо морозилке. <a href=\"https://nchfp.uga.edu/how/can/general-information/ensuring-safe-canned-foods/\">NCHFP<\/a>.<\/p>\n<p>Сырые креветки обязательно готовят. Просто разморозить можно только продукт, который уже готов к употреблению по маркировке. Для печени на конец недели берите свежую/размороженную порцию либо своевременно замороженную готовую. Яичные блюда удобнее готовить перед едой.<\/p>"}], "safety": "<p>Здесь принят простой консервативный режим: готовые скоропортящиеся компоненты планируем использовать <strong>в пределах 48 часов<\/strong>, а избыток замораживаем своевременно. Это соответствует бытовой рекомендации <a href=\"https://www.gov.uk/government/publications/how-to-chill-freeze-and-defrost-food-safely/how-to-chill-freeze-and-defrost-food-safely\">FSA<\/a>. Для ряда готовых продуктов американская таблица допускает 3–4 дня; это другой ориентир, а не разрешение автоматически продлевать любой домашний соус. <a href=\"https://www.foodsafety.gov/food-safety-charts/cold-food-storage-charts\">FoodSafety.gov: таблица хранения<\/a>.<\/p>\n<ul><li>Холодильник — не выше 4 °C; морозилка — −18 °C или ниже. Срок на упаковке, если короче, имеет приоритет.<\/li><li>Разделять сырьё и готовую еду; сырую рыбу и мясо держать в закрытой ёмкости на нижней полке.<\/li><li>После готовки быстро делить на небольшие неглубокие порции и охлаждать. Убрать в холодильник не позднее двух часов; не оставлять большую кастрюлю «до полного остывания». При необходимости использовать холодную водяную баню. <a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\">USDA: охлаждение и остатки<\/a>.<\/li><li>Птицу, включая фарш, готовить до 74 °C внутри; говяжий фарш — до 71 °C; рыбу — до 63 °C. При разогреве готового компонента ориентир — 74 °C внутри. Минуты в рецепте не заменяют проверку готовности. <a href=\"https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures\">FoodSafety.gov: температуры<\/a>.<\/li><li>Рис — отдельное правило: быстро охладить, желательно в течение часа, держать в холодильнике не более 24 часов; для более позднего использования сразу быстро охладить и заморозить порционно. Разогревать один раз. <a href=\"https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker#rice\">FSA: рис<\/a>.<\/li><li>Доставать и разогревать только нужную порцию. Добавление нового соуса не начинает срок хранения старого компонента заново.<\/li><li>Замороженные порции подписывать. Для учебного оборота использовать их в течение месяца: это выбранный удобный горизонт планирования, не универсальный санитарный предел.<\/li><\/ul>\n<p>В примере со скриншота важно заменить «полностью остудить перед хранением» конкретным порядком быстрого охлаждения. В карточке жареного риса также нужна явная ссылка на сроки хранения риса.<\/p>", "sauceIntro": "<p>Соусы рассчитаны на несколько использований. Делайте половину порции, если ближайшие блюда не требуют полного объёма. В этой подборке хранение всех свежих соусов — до 48 часов в холодильнике в чистой закрытой ёмкости, либо короче по сроку самого скоропортящегося ингредиента. Готовить маленькими порциями проще, чем пытаться максимально продлить срок.<\/p>", "week": [["Понедельник", "Творожная миска З3", "Треска 49 + картофель", "Тефтели 05 + коул-слоу 41", "Вечером подготовить овсяную основу Н."], ["Вторник", "Н с фруктом или оладьи З7", "Тосты с фасолью 43 + овощи", "Котлеты 48 + свёкла с капустой 60", "Порцию котлет на конец недели заморозить в день приготовления."], ["Среда", "Солёный творог З4", "Тыквенный суп 50", "Курица 01 или 04 + салат 64", "Новая партия печёной тыквы: часть на четверг, запас сразу заморозить."], ["Четверг", "Каша из киноа З8", "Ролл с тыквой 58", "Карри с нутом 54", "Приготовить запеканку З9 на пятницу; излишек заморозить."], ["Пятница", "Запеканка З9 с ягодами", "Фасолевая паста 45", "Рыба с пюре 53", "Фасолевую основу взять новой партией или размороженной."], ["Суббота", "Скрэмбл З5", "Суп с тофу 51", "Печёночные оладьи 56 + овощи", "Для печени использовать свежую/размороженную порцию."], ["Воскресенье", "Сырники З10", "Тефтели 08 + гарнир", "Цветная капуста с яйцами 52", "Яйца готовить свежими. Проверить запасы для нового цикла."]], "planning": "Это пример сочетаний для трёх приёмов пищи, а не индивидуально рассчитанный рацион. Порции, перекусы и дополнительные гарниры выбирают по потребностям. Все ссылки ведут к карточкам сборника; компоненты на поздние дни не хранят с воскресенья в холодильнике.\n\nИспользуйте две основные сессии и небольшое пополнение по ходу недели. В первую сессию можно сделать Л, М, тефтели и томатный соус. В среду — овощи/тыкву и карри. Сырые рыбу и птицу на дальние дни заморозить заранее; нужные порции переложить в холодильник накануне. Овсяную основу смешивать вечером, яйца готовить перед едой.\n\nДля закупки выберите фактические блюда, умножьте карточки на число порций, суммируйте одинаковые ингредиенты и вычтите запасы. Салаты выбираются, а не готовятся все сразу.\n\nПодход «сначала приготовить овощную основу карри, затем разделить на растительную и мясную части» полезен для семьи с разными предпочтениями. Разделять чистым прибором до добавления сырого мяса. Остаток предназначать конкретному блюду или заморозке сразу, а не оставлять без плана.", "planningHtml": "<p>Это пример сочетаний для трёх приёмов пищи, а не индивидуально рассчитанный рацион. Порции, перекусы и дополнительные гарниры выбирают по потребностям. Все ссылки ведут к карточкам сборника; компоненты на поздние дни не хранят с воскресенья в холодильнике.<\/p>\n<p>Используйте две основные сессии и небольшое пополнение по ходу недели. В первую сессию можно сделать Л, М, тефтели и томатный соус. В среду — овощи/тыкву и карри. Сырые рыбу и птицу на дальние дни заморозить заранее; нужные порции переложить в холодильник накануне. Овсяную основу смешивать вечером, яйца готовить перед едой.<\/p>\n<p>Для закупки выберите фактические блюда, умножьте карточки на число порций, суммируйте одинаковые ингредиенты и вычтите запасы. Салаты выбираются, а не готовятся все сразу.<\/p>\n<p>Подход «сначала приготовить овощную основу карри, затем разделить на растительную и мясную части» полезен для семьи с разными предпочтениями. Разделять чистым прибором до добавления сырого мяса. Остаток предназначать конкретному блюду или заморозке сразу, а не оставлять без плана.<\/p>", "sources": [{"title": "Клетчатка", "full": "Настя Пронина. «Как добирать клетчатку и не разориться», 2026. PDF, 13 страниц.", "coverage": "С. 3–4: доступные продукты и принцип подготовки; с. 5–6: печёные овощи; с. 7–8: капустная база; с. 9–10: белая фасоль; с. 11: овсяная основа; с. 12: корнеплоды."}, {"title": "План", "full": "Настя Пронина. «План-конструктор здорового питания на неделю через заготовки». PDF, 23 страницы.", "coverage": "С. 6–7: закупки; с. 8–11: подготовительная сессия; с. 12–18: меню и рецепты; с. 19: салаты и заправки."}], "updated": "24.10.2026"};
const app=document.getElementById('app');
const dialog=document.getElementById('recipeDialog');
const allRecipes=data.recipes;
const allItems=[...allRecipes,...data.sauces,...data.breakfasts];
let view='bases',query='',baseFilter='',modalStack=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>s.replace(/\*\*/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
function card(r){const b=data.bases.find(x=>x.id===r.base);const desc=r.ingredients?r.ingredientList.slice(0,3).join(' · '):plain(r.body).slice(0,137)+'…';return `<button class="recipe-card" data-recipe="${r.id}"><div class="recipe-meta"><span class="code">${esc(r.code)}${b?' / '+esc(b.short):''}</span><span class="time">${esc(r.time)}</span></div><h3>${esc(r.name)}</h3><p>${esc(desc)}</p><span class="open-label">Открыть рецепт ↗</span></button>`}
function home(){return `<section class="hero"><div><div class="eyebrow">Меньше готовить. Разнообразнее есть.</div><h1>Капсульная<br>кухня</h1><p class="sub">Одна заготовка.<br>Разные блюда.</p><p>Подготовьте основу заранее.<br>Добавьте свежие продукты и соус —<br>соберите ужин по настроению.</p><button class="button" id="chooseBase">Выбрать заготовку <span>↓</span></button></div><div class="hero-art" aria-label="Пример: из готовой курицы получаются паста, шаурма и рис с овощами"><div class="label">Заготовили один раз</div>${data.bases[0].svg}<div class="source-pill">Курица кусочками</div><div class="branch"></div><div class="outcomes"><div><b>Паста</b><span>лимон + шпинат</span></div><div><b>Шаурма</b><span>овощи + йогурт</span></div><div><b>Рис</b><span>брокколи + яйцо</span></div></div></div></section><div class="numbers"><div><strong>14</strong><span>основ для сборки</span></div><div><strong>66</strong><span>блюд и салатов</span></div><div><strong>10–15</strong><span>минут на быстрые сборки*</span></div></div><section id="basesGrid"><div class="section-head"><h2>С чего начнём?</h2><p>Выберите основу. Внутри — подготовка, хранение и варианты подачи.</p></div><div class="base-grid">${data.bases.map(b=>`<article class="base-card"><div class="base-top">${b.svg}<div><div class="base-letter">ЗАГОТОВКА ${esc(b.letter)}</div><h3>${esc(b.short)}</h3><div class="base-role">${esc(b.role)}</div></div></div><div class="base-paths">${b.recipes.map(r=>`<button class="path" data-recipe="${r.id}">${esc(r.name)}</button>`).join('')}</div><button class="base-open" data-base="${b.id}">Как заготовить <span>↗</span></button></article>`).join('')}</div></section><aside class="principle"><h3>Готовьте компоненты.<br>Оставляйте место<br>для свежего.</h3><div><p>Блюда под каждой заготовкой — варианты на выбор. Чтобы приготовить несколько, сложите нужное количество основы для выбранных рецептов.</p><p style="margin-top:15px">* Заготовки уже готовы, замороженное заранее разморожено. Закупки, подготовка и охлаждение считаются отдельно. Время и выход требуют кухонной проверки.</p></div></aside>`}
function recipes(){return `<header class="pagehead"><div class="eyebrow">Общая библиотека сочетаний</div><h2>Что приготовим сегодня?</h2><p>Ищите по названию, продукту или коду рецепта. Обычно количества на двоих; выход партии указан в карточке.</p></header><div class="filters"><div class="field"><label for="search">Название или ингредиент</label><input id="search" type="search" placeholder="Например, фасоль, паста, тыква" value="${esc(query)}"></div><div class="field"><label for="baseSelect">Заготовка или тип блюда</label><select id="baseSelect"><option value="">Все блюда</option><option value="__salad" ${baseFilter==='__salad'?'selected':''}>Салаты</option>${data.bases.map(b=>`<option value="${b.id}" ${baseFilter===b.id?'selected':''}>${esc(b.short)}</option>`).join('')}</select></div></div><p class="result-count" id="resultCount" aria-live="polite"></p><div class="recipe-grid" id="results"></div>`}
function updateResults(){const q=query.toLocaleLowerCase('ru').replaceAll('ё','е');const found=allRecipes.filter(r=>(!baseFilter||(r.baseIds||[]).includes(baseFilter)||(baseFilter==='__salad'&&r.kind==='salad'))&&plain(r.code+' '+r.name+' '+r.ingredients+' '+r.body).toLocaleLowerCase('ru').replaceAll('ё','е').includes(q));document.getElementById('resultCount').textContent=`Найдено: ${found.length} из ${allRecipes.length} блюд и салатов`;document.getElementById('results').innerHTML=found.length?found.map(card).join(''):'<div class="empty">По этому запросу блюд нет.<br>Попробуйте другой продукт или выберите все блюда.</div>'}
function basePage(id){const b=data.bases.find(x=>x.id===id);return `<button class="back" data-view="bases">← Все заготовки</button><header class="base-detail-head"><div><div class="eyebrow">Заготовка ${esc(b.letter)} · ${esc(b.role)}</div><h1>${esc(b.name)}</h1></div>${b.svg}</header><div class="base-layout"><section class="prep-box"><h3>Подготовить основу</h3><div class="rich">${b.html}</div>${b.source?`<p class="source-note">Источник идеи: ${esc(b.source)}. Пропорции и время адаптированы для сборника.</p>`:''}<button class="ref-button" data-view="guide">Правила хранения ↗</button></section><aside class="usage"><h3>Одна основа → разные блюда</h3>${b.recipes.map(r=>`<button class="path" data-recipe="${r.id}">${esc(r.name)}<br><small>${esc(r.time)}</small></button>`).join('')}<p>Выберите нужные блюда и суммируйте расход заготовки. Количество в рецептах рассчитано на двух взрослых.</p></aside></div><div class="section-head"><h2>Собрать и подать</h2><p>Меняйте вкус, форму блюда и свежие дополнения.</p></div><div class="recipe-grid">${b.recipes.map(card).join('')}</div>`}
function bonus(kind){const sauce=kind==='sauces',arr=sauce?data.sauces:data.breakfasts;return `<header class="pagehead"><div class="eyebrow">${sauce?'Маленькая деталь — другой вкус':'Та же корзина продуктов'}</div><h2>${sauce?'Девять соусов на разные случаи':'Завтраки без долгой готовки'}</h2><p>${sauce?'Меняйте характер блюда несколькими ложками соуса. Готовьте небольшие порции под ближайшие ужины.':'Десять сладких и солёных вариантов. У запеканки указан выход партии, у остальных — порции на двоих.'}</p></header>${sauce?`<div class="bonus-intro rich">${data.sauceIntro}</div>`:'<div class="note-banner">Ночная овсянка требует времени на замачивание. Для остальных рецептов учитывайте размер сковороды и инструкцию на упаковке.</div>'}<div class="recipe-grid">${arr.map(card).join('')}</div>`}
function guide(){const intro=data.notes.find(n=>n.title==='Как пользоваться');const others=data.notes.filter(n=>n.title!=='Как пользоваться');return `<header class="pagehead"><div class="eyebrow">Сохранить под рукой</div><h2>Памятки для спокойной готовки</h2><p>Клетчатка, хранение, гарниры и замены — всё, что помогает пользоваться сборником каждый день.</p></header><div class="guide-grid"><section class="guide-card wide fiber-guide" id="fiberGuide"><div class="eyebrow">Овощи, крупы и бобовые</div><h3>${esc(data.guides[0].title)}</h3><div class="rich">${data.guides[0].html}</div><div class="link-row">${recipeLinks(['p1','p2','p3'])}</div></section><section class="guide-card wide"><h3>Хранение и готовность</h3><div class="rich">${data.safety}</div></section><section class="guide-card wide"><h3>Как читать карточки</h3><div class="rich">${intro.html}</div></section>${[...data.guides.slice(1),...others].map(n=>`<section class="guide-card wide"><h3>${esc(n.title)}</h3><div class="rich">${n.html}</div></section>`).join('')}<section class="guide-card wide rich"><h3>Источники рецептов</h3><p>В карточках сохранены ссылки на источники идей. Обозначения «Клетчатка» и «План» относятся к материалам Насти Прониной; номера — страницы PDF, включая обложки. Пропорции и время адаптированы для этого сборника и требуют кухонной проверки.</p>${data.sources.map(x=>`<p>${esc(x.full)}</p><p>${esc(x.coverage)}</p>`).join('')}</section></div>`}
function show(v,id,scroll=true){view=v;document.querySelectorAll('.navbtn').forEach(n=>{if(n.dataset.view===(v==='base'?'bases':v))n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});if(v==='bases')app.innerHTML=home();else if(v==='base')app.innerHTML=basePage(id);else if(v==='recipes'){app.innerHTML=recipes();updateResults();document.getElementById('search').addEventListener('input',e=>{query=e.target.value;updateResults()});document.getElementById('baseSelect').addEventListener('change',e=>{baseFilter=e.target.value;updateResults()})}else if(v==='guide')app.innerHTML=guide();else if(v==='week')app.innerHTML=weekPage();else app.innerHTML=bonus(v);if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function portion(r){return r.servings||(r.kind==='sauce'?'На несколько использований':'На двоих')}
function recipeLinks(ids){return ids.map(id=>{const b=data.bases.find(x=>x.id===id);const r=allItems.find(x=>x.id===id);return b?`<button class="ref-button" data-base="${b.id}">${esc(b.letter+' · '+b.short)} ↗</button>`:r?`<button class="ref-button" data-recipe="${r.id}">${esc(r.code+' · '+r.name)} ↗</button>`:''}).join('')}
function openRecipe(id,back=false){
 const r=allItems.find(x=>x.id===id);if(!r){if(data.bases.some(b=>b.id===id)){if(dialog.open)dialog.close();show('base',id)}return}if(!back)modalStack.push(id);
 const b=data.bases.find(x=>x.id===r.base);let refs=[...(r.refs||[])];
 for(const match of ((r.raw||'').match(/С[1-9]/g)||[])){const ss=data.sauces.find(x=>x.code===match);if(ss&&ss.id!==r.id&&!refs.includes(ss.id))refs.push(ss.id)}
 document.getElementById('dialogLabel').textContent=({sauce:'Соус',breakfast:'Завтрак',prep:'Основа',salad:'Салат'}[r.kind]||'Блюдо')+' '+r.code;
 document.getElementById('dialogContent').innerHTML=`${modalStack.length>1?'<button class="back" id="modalBack" style="margin:0 0 15px">← Назад к рецепту</button>':''}<h2 id="dialogTitle" tabindex="-1">${esc(r.name)}</h2><div class="modal-meta"><span class="time">${esc(r.time)}</span><span>${esc(portion(r))}</span></div>${r.ingredients?`<section class="ingredients"><h3>Что понадобится</h3><ul>${r.ingredientList.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></section><h3 style="font:23px var(--serif)">Как приготовить</h3>`:''}<div class="rich">${r.html}</div>${refs.length?`<div class="link-row">${recipeLinks(refs)}</div>`:''}${r.source?`<p class="source-note">Источник идеи: ${esc(r.source)}. Материалы Насти Прониной; номера — страницы PDF. Количества, время и способ уточнены для этого сборника.</p>`:''}${b?`<div class="source-note">Основа: <button class="ref-button" data-base="${b.id}">${esc(b.short)} ↗</button><br><br>Время предполагает готовую заготовку. Горячие блюда с готовыми компонентами прогревайте до 74 °C внутри; дополнительные условия — в памятках.</div>`:r.source?'':`<p class="source-note">${r.kind==='sauce'?'Хранение: до 48 часов в холодильнике, либо короче по сроку ингредиентов.':'Время и выход ориентировочные.'}</p>`}`;
 if(!dialog.open)dialog.showModal();dialog.scrollTop=0;document.getElementById('dialogTitle').focus({preventScroll:true});
}
function linkedText(t){return esc(t).replace(/(^|[\s(])([АБВГДЕЖЗИКЛМНО]|С\d{1,2}|З\d{1,2}|\d{2})(?=$|[\s,;+.)])/g,(m,before,code)=>{const r=allItems.find(x=>x.code===code);const b=data.bases.find(x=>x.letter===code);return r?before+`<button class="inline-ref" data-recipe="${r.id}" aria-label="Открыть ${esc(r.name)}">${code}</button>`:b?before+`<button class="inline-ref" data-base="${b.id}" aria-label="Открыть ${esc(b.name)}">${code}</button>`:m})}
function weekCards(interactive=true){return `<div class="week-grid">${data.week.map(row=>`<article class="week-card"><h3>${esc(row[0])}</h3>${['Завтрак','Обед','Ужин'].map((label,i)=>`<p><strong>${label}</strong>${interactive?linkedText(row[i+1]):esc(row[i+1])}</p>`).join('')}<div class="week-action">${interactive?linkedText(row[4]):esc(row[4])}</div></article>`).join('')}</div>`}
function weekPage(){return `<header class="pagehead"><div class="eyebrow">Пример сочетаний</div><h2>Неделя в своём ритме</h2><p>Завтраки, обеды и ужины из общей библиотеки. Нажмите на код, чтобы открыть блюдо или заготовку.</p></header>${weekCards()}<section class="guide-card rich" style="margin-top:24px"><h3>Подготовить заранее</h3>${data.planningHtml}</section>`}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view],[data-base],[data-recipe]');if(n){if(n.dataset.recipe){if(!dialog.open)modalStack=[];openRecipe(n.dataset.recipe)}else {if(dialog.open)dialog.close();show(n.dataset.base?'base':n.dataset.view,n.dataset.base)}return}if(e.target.closest('#chooseBase'))document.getElementById('basesGrid').scrollIntoView({behavior:'smooth'});if(e.target.closest('#modalBack')){modalStack.pop();openRecipe(modalStack.at(-1),true)}const a=e.target.closest('a[href="#guide"]');if(a){e.preventDefault();if(dialog.open)dialog.close();show('guide')}});
dialog.querySelector('.close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
function printRecipe(r){return `<article class="print-recipe"><h3>${esc(r.code+'. '+r.name)}</h3><p>${esc(r.time)} · ${esc(portion(r))}</p>${r.ingredients?'<p><strong>Ингредиенты:</strong> '+esc(r.ingredients)+'</p>':''}${r.html}${r.source?`<p class="source-note">Источник идеи: ${esc(r.source)}. Адаптация.</p>`:''}</article>`}
document.getElementById('printBook').innerHTML=`<h1>Капсульная кухня</h1><p>Единый сборник · 14 основ · 66 блюд и салатов · 10 завтраков · 9 соусов · ${esc(data.updated)}</p><div class="rich">${data.notes.find(n=>n.title==='Как пользоваться').html}</div><section class="print-chapter"><h2>Заготовки</h2>${data.bases.map(b=>`<article class="print-base">${b.svg}<h3>${esc(b.letter+'. '+b.name)}</h3>${b.html}<p><strong>Во что превратить:</strong> ${b.recipes.map(r=>esc(r.code+' · '+r.name)).join('; ')}.</p></article>`).join('')}</section><section class="print-chapter"><h2>Блюда и салаты</h2>${allRecipes.map(printRecipe).join('')}</section><section class="print-chapter"><h2>Завтраки</h2>${data.breakfasts.map(printRecipe).join('')}</section><section class="print-chapter"><h2>Соусы</h2>${data.sauceIntro}${data.sauces.map(printRecipe).join('')}</section><section class="print-chapter"><h2>Меню на неделю</h2>${weekCards(false)}${data.planningHtml}</section><section class="print-chapter"><h2>Памятки</h2>${data.guides.map(g=>'<h2>'+esc(g.title)+'</h2>'+g.html).join('')}${data.safety}${data.notes.filter(n=>n.title!=='Как пользоваться').map(n=>'<h2>'+esc(n.title)+'</h2>'+n.html).join('')}<h2>Источники рецептов</h2>${data.sources.map(x=>'<p>'+esc(x.full)+' '+esc(x.coverage)+'</p>').join('')}</section>`;
show('bases',null,false);
</script>
</body>
</html>
