'use strict';
const data={"bases": [{"id": "b1", "letter": "А", "name": "Нейтральная курица кусочками", "short": "Курица", "role": "Готовый белок", "color": "#E8EDDC", "intro": "**Сырьё:** 900 г филе куриного бедра без кожи или грудки, 15 г масла, соль, перец. **Выход:** примерно 650–720 г. **Работа:** 15–20 минут активно, 25–35 минут до готовности, охлаждение отдельно.\n\n1. Нарезать кусочками 2–3 см, обсушить.\n2. Разогреть большую сковороду; обжарить в 2–3 приёма с маслом, не перегружая её. Ориентировочно 6–10 минут на партию, до 74 °C внутри самых толстых кусочков.\n3. Разделить на порции по 300 г для двух человек. Дать лишнему пару выйти при быстром охлаждении и своевременно убрать в холодильник.\n\nХранение: готовая основа — до 48 часов; можно заморозить. При разогреве добавить 1–2 ст. л. воды и сначала накрыть крышкой. Курица нейтральная, но не несолёная и не безвкусная: просто без сильного соуса.\n\nВариант вашего примера: отдельно обжарить лук и перец и распределить рядом с мясом. Хранение компонентов отдельно расширяет выбор блюд. Если смешать их сразу, учитывать, что 300 г смеси содержит меньше мяса, чем 300 г курицы.", "html": "<p><strong>Сырьё:<\/strong> 900 г филе куриного бедра без кожи или грудки, 15 г масла, соль, перец. <strong>Выход:<\/strong> примерно 650–720 г. <strong>Работа:<\/strong> 15–20 минут активно, 25–35 минут до готовности, охлаждение отдельно.<\/p>\n<ol><li>Нарезать кусочками 2–3 см, обсушить.<\/li><li>Разогреть большую сковороду; обжарить в 2–3 приёма с маслом, не перегружая её. Ориентировочно 6–10 минут на партию, до 74 °C внутри самых толстых кусочков.<\/li><li>Разделить на порции по 300 г для двух человек. Дать лишнему пару выйти при быстром охлаждении и своевременно убрать в холодильник.<\/li><\/ol>\n<p>Хранение: готовая основа — до 48 часов; можно заморозить. При разогреве добавить 1–2 ст. л. воды и сначала накрыть крышкой. Курица нейтральная, но не несолёная и не безвкусная: просто без сильного соуса.<\/p>\n<p>Вариант вашего примера: отдельно обжарить лук и перец и распределить рядом с мясом. Хранение компонентов отдельно расширяет выбор блюд. Если смешать их сразу, учитывать, что 300 г смеси содержит меньше мяса, чем 300 г курицы.<\/p>", "recipes": [{"id": "r01", "code": "01", "name": "Лимонная паста с курицей и шпинатом", "time": "12–15 минут", "body": "1. Сварить пасту. Одновременно прогреть курицу со сливками и 80 мл воды от пасты.\n2. Добавить шпинат на 1–2 минуты, затем пасту. Прогреть основу насквозь.\n3. Выключить огонь, вмешать сыр, лимон и при необходимости ещё немного воды. Подать с нарезанными помидорами.\n\n**Изменение основы:** сочная эмульсия и свежая кислота; сливочный сыр не обязателен. Аллергены: пшеница, молоко.", "ingredients": "курица 300 г; сухая паста с варкой 8–10 минут 160 г; шпинат 150 г; сливки 10% 80 мл; твёрдый сыр 20 г; лимонный сок 10 мл; вода от пасты 80–120 мл; помидоры 250 г для подачи.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; сухая паста с варкой 8–10 минут 160 г; шпинат 150 г; сливки 10% 80 мл; твёрдый сыр 20 г; лимонный сок 10 мл; вода от пасты 80–120 мл; помидоры 250 г для подачи.\n1. Сварить пасту. Одновременно прогреть курицу со сливками и 80 мл воды от пасты.\n2. Добавить шпинат на 1–2 минуты, затем пасту. Прогреть основу насквозь.\n3. Выключить огонь, вмешать сыр, лимон и при необходимости ещё немного воды. Подать с нарезанными помидорами.\n\n**Изменение основы:** сочная эмульсия и свежая кислота; сливочный сыр не обязателен. Аллергены: пшеница, молоко.", "html": "<ol><li>Сварить пасту. Одновременно прогреть курицу со сливками и 80 мл воды от пасты.<\/li><li>Добавить шпинат на 1–2 минуты, затем пасту. Прогреть основу насквозь.<\/li><li>Выключить огонь, вмешать сыр, лимон и при необходимости ещё немного воды. Подать с нарезанными помидорами.<\/li><\/ol>\n<p><strong>Изменение основы:<\/strong> сочная эмульсия и свежая кислота; сливочный сыр не обязателен. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["курица 300 г", "сухая паста с варкой 8–10 минут 160 г", "шпинат 150 г", "сливки 10% 80 мл", "твёрдый сыр 20 г", "лимонный сок 10 мл", "вода от пасты 80–120 мл", "помидоры 250 г для подачи"], "refs": [], "baseIds": ["b1"]}, {"id": "r02", "code": "02", "name": "Кесадилья с курицей и капустным салатом", "time": "12–15 минут", "body": "1. Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.\n2. Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.\n3. Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.\n\n**Изменение основы:** хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.", "ingredients": "курица 300 г; 2 большие тортильи; сыр 60 г; томатная основа К 60 г или пассата; паприка ½ ч. л.; капуста 250 г; йогуртовый соус С1 80 г; лимонный сок 10 мл.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; 2 большие тортильи; сыр 60 г; томатная основа К 60 г или пассата; паприка ½ ч. л.; капуста 250 г; йогуртовый соус С1 80 г; лимонный сок 10 мл.\n1. Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.\n2. Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.\n3. Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.\n\n**Изменение основы:** хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.", "html": "<ol><li>Прогреть мелко нарезанную курицу с томатом и паприкой. Капусту нашинковать, слегка размять с лимоном.<\/li><li>Распределить начинку и сыр на половине каждой лепёшки, сложить. Подрумянить на сухой сковороде с двух сторон, до расплавления сыра. На большой сковороде можно готовить обе одновременно.<\/li><li>Подать с капустой и соусом. На маленькой сковороде заложить ещё 4–5 минут на вторую порцию.<\/li><\/ol>\n<p><strong>Изменение основы:<\/strong> хрустящая оболочка вместо мягкой пасты. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["курица 300 г", "2 большие тортильи", "сыр 60 г", "томатная основа К 60 г или пассата", "паприка ½ ч. л", "капуста 250 г", "йогуртовый соус С1 80 г", "лимонный сок 10 мл"], "refs": [], "baseIds": ["b1", "p1"]}, {"id": "r03", "code": "03", "name": "Рис с курицей, брокколи и яйцом", "time": "12–15 минут", "body": "1. Брокколи готовить на сковороде с 40 мл воды под крышкой 3–4 минуты.\n2. Добавить масло, курицу, имбирь и рис. Прогреть, разбивая комочки.\n3. Сдвинуть компоненты, в свободной части приготовить яйца до схватывания; перемешать, добавить соевый соус. Довести всё блюдо до нужной температуры, посыпать луком.\n\n**Условие:** рис быстро охлаждён и хранится не больше суток либо был своевременно заморожен и разморожен в холодильнике. Подробнее — памятка ниже. Аллергены: яйца, соя, часто пшеница, опционально кунжут.", "ingredients": "курица 300 г; готовый рис 300 г; брокколи мелкими соцветиями 250 г; 2 яйца; соевый соус 15 мл; имбирь 5 г; масло 10 г; зелёный лук 15 г; кунжут 5 г по желанию.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; готовый рис 300 г; брокколи мелкими соцветиями 250 г; 2 яйца; соевый соус 15 мл; имбирь 5 г; масло 10 г; зелёный лук 15 г; кунжут 5 г по желанию.\n1. Брокколи готовить на сковороде с 40 мл воды под крышкой 3–4 минуты.\n2. Добавить масло, курицу, имбирь и рис. Прогреть, разбивая комочки.\n3. Сдвинуть компоненты, в свободной части приготовить яйца до схватывания; перемешать, добавить соевый соус. Довести всё блюдо до нужной температуры, посыпать луком.\n\n**Условие:** рис быстро охлаждён и хранится не больше суток либо был своевременно заморожен и разморожен в холодильнике. Подробнее — памятка ниже. Аллергены: яйца, соя, часто пшеница, опционально кунжут.", "html": "<ol><li>Брокколи готовить на сковороде с 40 мл воды под крышкой 3–4 минуты.<\/li><li>Добавить масло, курицу, имбирь и рис. Прогреть, разбивая комочки.<\/li><li>Сдвинуть компоненты, в свободной части приготовить яйца до схватывания; перемешать, добавить соевый соус. Довести всё блюдо до нужной температуры, посыпать луком.<\/li><\/ol>\n<p><strong>Условие:<\/strong> рис быстро охлаждён и хранится не больше суток либо был своевременно заморожен и разморожен в холодильнике. Подробнее — памятка ниже. Аллергены: яйца, соя, часто пшеница, опционально кунжут.<\/p>", "ingredientList": ["курица 300 г", "готовый рис 300 г", "брокколи мелкими соцветиями 250 г", "2 яйца", "соевый соус 15 мл", "имбирь 5 г", "масло 10 г", "зелёный лук 15 г", "кунжут 5 г по желанию"], "refs": [], "baseIds": ["b1"]}, {"id": "r04", "code": "04", "name": "Домашняя шаурма с курицей", "time": "10–12 минут", "body": "1. Курицу прогреть со специями и 2 ст. л. воды. Овощи тонко нарезать.\n2. На лаваш нанести соус, добавить начинку и овощи, плотно завернуть.\n3. По желанию подсушить швом вниз на сухой сковороде. Соус и помидоры добавлять непосредственно перед сборкой, чтобы лаваш не размок.\n\n**Изменение основы:** свежие овощи и аромат специй. Аллергены: пшеница, молоко.", "ingredients": "курица 300 г; 2 порции тонкого лаваша по 60–70 г; капуста 200 г; огурец 150 г; помидоры 150 г; соус С1 100 г; паприка и зира по ¼ ч. л.", "kind": "recipe", "base": "b1", "raw": "курица 300 г; 2 порции тонкого лаваша по 60–70 г; капуста 200 г; огурец 150 г; помидоры 150 г; соус С1 100 г; паприка и зира по ¼ ч. л.\n1. Курицу прогреть со специями и 2 ст. л. воды. Овощи тонко нарезать.\n2. На лаваш нанести соус, добавить начинку и овощи, плотно завернуть.\n3. По желанию подсушить швом вниз на сухой сковороде. Соус и помидоры добавлять непосредственно перед сборкой, чтобы лаваш не размок.\n\n**Изменение основы:** свежие овощи и аромат специй. Аллергены: пшеница, молоко.", "html": "<ol><li>Курицу прогреть со специями и 2 ст. л. воды. Овощи тонко нарезать.<\/li><li>На лаваш нанести соус, добавить начинку и овощи, плотно завернуть.<\/li><li>По желанию подсушить швом вниз на сухой сковороде. Соус и помидоры добавлять непосредственно перед сборкой, чтобы лаваш не размок.<\/li><\/ol>\n<p><strong>Изменение основы:<\/strong> свежие овощи и аромат специй. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["курица 300 г", "2 порции тонкого лаваша по 60–70 г", "капуста 200 г", "огурец 150 г", "помидоры 150 г", "соус С1 100 г", "паприка и зира по ¼ ч. л"], "refs": [], "baseIds": ["b1", "p1"]}, {"id": "n15", "code": "54", "name": "Зелёное карри: одна овощная база", "time": "20–25 минут", "ingredients": "брокколи 200 г; стручковая фасоль 150 г; горошек 100 г; кокосовое молоко 150 мл; вода 150 мл; карри 1 ч. л.; чеснок 1 зубчик; масло 5 г; нут 300 г или готовая птица 300 г; кускус сухой 100 г", "body": "Прогреть чеснок и карри в масле, добавить овощи, кокосовое молоко и воду. Тушить до готовности овощей. Если часть соуса нужна для другого блюда, отложить её сейчас чистым прибором. В выбранную порцию добавить нут или готовую птицу и тщательно прогреть. Кускус приготовить отдельно. Для хранения быстро охладить; до 48 часов либо заморозить. Аллерген: пшеница; проверить специи.", "source": "План, с. 11, 15", "refs": ["b1", "b5"], "kind": "recipe", "servings": "На двоих", "html": "<p>Прогреть чеснок и карри в масле, добавить овощи, кокосовое молоко и воду. Тушить до готовности овощей. Если часть соуса нужна для другого блюда, отложить её сейчас чистым прибором. В выбранную порцию добавить нут или готовую птицу и тщательно прогреть. Кускус приготовить отдельно. Для хранения быстро охладить; до 48 часов либо заморозить. Аллерген: пшеница; проверить специи.<\/p>", "raw": "брокколи 200 г; стручковая фасоль 150 г; горошек 100 г; кокосовое молоко 150 мл; вода 150 мл; карри 1 ч. л.; чеснок 1 зубчик; масло 5 г; нут 300 г или готовая птица 300 г; кускус сухой 100 г\nПрогреть чеснок и карри в масле, добавить овощи, кокосовое молоко и воду. Тушить до готовности овощей. Если час  г", "паприка 1 ч. л", "зира ½ ч. л", "йогурт 60 г", "капуста 250 г"], "refs": [], "baseIds": ["b3"]}, {"id": "r11", "code": "11", "name": "Тёплый тако-салат", "time": "10–12 минут", "body": "Фарш и фасоль прогреть с паприкой и ложкой воды. Тортильи нарезать полосками и быстро подсушить на второй сковороде. В тарелках соединить листья и нарезанные овощи, сверху выложить горячую начинку, соус и хрустящие полоски. Собирать только перед едой. Аллергены: пшеница, молоко в С6.", "ingredients": "мясная основа 300 г; готовая фасоль 180 г; 2 тортильи; салатные листья 80 г; помидоры 250 г; огурец 150 г; соус С6 80 г; паприка ½ ч. л.", "kind": "salad", "base": "b3", "raw": "мясная основа 300 г; готовая фасоль 180 г; 2 тортильи; салатные листья 80 г; помидоры 250 г; огурец 150 г; соус С6 80 г; паприка ½ ч. л.\nФарш и фасоль прогреть с паприкой и ложкой воды. Тортильи нарезать полосками и быстро подсушить на второй сковороде. В тарелках соединить листья и нарезанные овощи, сверху выложить горячую начинку, соус и хрустящие полоски. Собирать только перед едой. Аллергены: пшеница, молоко в С6.", "html": "<p>Фарш и фасоль прогреть с паприкой и ложкой воды. Тортильи нарезать полосками и быстро подсушить на второй сковороде. В тарелках соединить листья и нарезанные овощи, сверху выложить горячую начинку, соус и хрустящие полоски. Собирать только перед едой. Аллергены: пшеница, молоко в С6.<\/p>", "ingredientList": ["мясная основа 300 г", "готовая фасоль 180 г", "2 тортильи", "салатные листья 80 г", "помидоры 250 г", "огурец 150 г", "соус С6 80 г", "паприка ½ ч. л"], "refs": [], "baseIds": ["b3"]}, {"id": "r12", "code": "12", "name": "Картофель с мясной начинкой", "time": "12–15 минут", "body": "Разрезать готовый картофель, разогреть в микроволновке под крышкой или нарезать и прогреть на сковороде с небольшим количеством воды. Отдельно прогреть фарш с томатом. Соединить, посыпать сыром и накрыть до его расплавления. Подать с овощами. Условие быстроты — картофель полностью приготовлен  fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"48.428418439854575\" cy=\"99.64592859903442\" rx=\"6.0\" ry=\"4.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(65%,45%,32%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"89.81151507096499\" cy=\"43.49585840167709\" rx=\"6.0\" ry=\"4.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(77%,58%,39%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"98.04095707260868\" cy=\"113.90328831858912\" rx=\"6.0\" ry=\"4.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(55%,38%,28%); fill-rule: evenodd;\"/>\n\t\t<\/g>\n\t<\/g>\n<\/svg>\n", "iconIndex": 2}, {"id": "b4", "letter": "Г", "name": "Зелёная или коричневая чечевица", "short": "Чечевица", "role": "Растительная основа", "color": "#E3E8D3", "intro": "**Сырьё:** сухая чечевица 300 г; вода по упаковке; лавровый лист по желанию. **Выход:** около 700–850 г. **Работа:** 5–10 минут активно, обычно 25–40 минут всего.\n\nПромыть, сварить до мягкости с сохранением формы и слить лишнюю воду. Красная чечевица для этих четырёх вариантов не равноценна: она сильнее разваривается. Разложить небольшими порциями. Хранение: до 48 часов; можно заморозить, после разморозки особенно удобно использовать в супах и соусах.", "html": "<p><strong>Сырьё:<\/strong> сухая чечевица 300 г; вода по упаковке; лавровый лист по желанию. <strong>Выход:<\/strong> около 700–850 г. <strong>Работа:<\/strong> 5–10 минут активно, обычно 25–40 минут всего.<\/p>\n<p>Промыть, сварить до мягкости с сохранением формы и слить лишнюю воду. Красная чечевица для этих четырёх вариантов не равноценна: она сильнее разваривается. Разложить небольшими порциями. Хранение: до 48 часов; можно заморозить, после разморозки особенно удобно использовать в супах и соусах.<\/p>", "recipes": [{"id": "r13", "code": "13", "name": "Чечевичный томатный соус к пасте", "time": "12–15 минут", "body": "Пасту сварить. Пока варится, мелко натёртую морковь прогреть в масле 2 минуты, добавить чечевицу и томат. Часть чечевицы размять лопаткой, добавить 50–100 мл воды от пасты и орегано. Прогреть, смешать с пастой. Подать со свежими овощами. Аллерген: пшеница.", "ingredients": "чечевица 350 г; томатная основа К 300 г; сухая паста 140 г; морковь 100 г; масло 5 г; орегано ½ ч. л.; листья или огурец 200 г для подачи.", "kind": "recipe", "base": "b4", "raw": "чечевица 350 г; томатная основа К 300 г; сухая паста 140 г; морковь 100 г; масло 5 г; орегано ½ ч. л.; листья или огурец 200 г для подачи.\nПасту сварить. Пока варится, мелко натёртую морковь прогреть в масле 2 минуты, добавить чечевицу и томат. Часть чечевицы размять лопаткой, добавить 50–100 мл воды от пасты и орегано. Прогреть, смешать с пастой. Подать со свежими овощами. Аллерген: пшеница.", "html": "<p>Пасту сварить. Пока варится, мелко натёртую морковь прогреть в масле 2 минуты, добавить чечевицу и томат. Часть чечевицы размять лопаткой, добавить 50–100 мл воды от пасты и орегано. Прогреть, смешать с пастой. Подать со свежими овощами. Аллерген: пшеница.<\/p>", "ingredientList": ["чечевица 350 г", "томатная основа К 300 г", "сухая паста 140 г", "морковь 100 г", "масло 5 г", "орегано ½ ч. л", "листья или огурец 200 г для подачи"], "refs": [], "baseIds": ["b4"]}, {"id": "r14", "code": "14", "name": "Салат с чечевицей, свёклой и фетой", "time": "8–10 минут", "body": "Свёклу и огурец нарезать, соединить с охлаждённой чечевицей и зеленью. Заправить, сверху раскрошить фету. Хлеб подсушить. Чечевицу можно подавать холодной при правильном приготовлении, охлаждении и хранении. Если варить свёклу с нуля, заявленное время не действует. Аллергены: молоко, горчица, пшеница в хлебе.", "ingredients": "чечевица 350 г; готовая отварная свёкла 250 г; огурец 200 г; фета 60 г; зелень 20 г; горчичная заправка С2 40 г; хлеб 100 г.", "kind": "salad", "base": "b4", "raw": "чечевица 350 г; готовая отварная свёкла 250 г; огурец 200 г; фета 60 г; зелень 20 г; горчичная заправка С2 40 г; хлеб 100 г.\nСвёклу и огурец нарезать, соединить с охлаждённой чечевицей и зеленью. Заправить, сверху раскрошить фету. Хлеб подсушить. Чечевицу можно подавать холодной при правильном приготовлении, охлаждении и хранении. Если варить свёклу с нуля, заявленное время не действует. Аллергены: молоко, горчица, пшеница в хлебе.", "html": "<p>Свёклу и огурец нарезать, соединить с охлаждённой чечевицей и зеленью. Заправить, сверху раскрошить фету. Хлеб подсушить. Чечевицу можно подавать холодной при правильном приготовлении, охлаждении и хранении. Если варить свёклу с нуля, заявленное время не действует. Аллергены: молоко, горчица, пшеница в хлебе.<\/p>", "ingredientList": ["чечевица 350 г", "готовая отварная свёкла 250 г", "огурец 200 г", "фета 60 г", "зелень 20 г", "горчичная заправка С2 40 г", "хлеб 100 г"], "refs": [], "baseIds": ["b4"]}, {"id": "r15", "code": "15", "name": "Чечевица карри со шпинатом", "time": "12–15 минут", "body": "Кускус приготовить по упаковке. В сковороде соединить чечевицу, томат, кокосовое молоко, воду и карри; прогреть 5–7 минут. Добавить шпинат, затем лимон. Подать с кускусом. Часть кокосового молока заменена водой, чтобы соус не был излишне тяжёлым. Аллерген: пшеница; состав смеси карри проверить.", "ingredients": "чечевица 350 г; томатная основа К 150 г; кокосовое молоко 100 мл; вода 100 мл; шпинат 150 г; карри 1 ч. л.; сухой кускус 100 г; лимонный сок 10 мл.", "kind": "recipe", "base": "b4", "raw": "чечевица 350 г; томатная основа К 150 г; кокосовое молоко 100 мл; вода 100 мл; шпинат 150 г; карри 1 ч. л.; сухой кускус 100 г; лимонный сок 10 мл.\nКускус приготовить по упаковке. В сковороде соединить чечевицу, томат, кокосовое молоко, воду и карри; прогреть 5–7 минут. Добавить шпинат, затем лимон. Подать с кускусом. Часть кокосового молока заменена водой, чтобы соус не был излишне тяжёлым. Аллерген: пшеница; состав смеси карри проверить.", "html": "<p>Кускус приготовить по упаковке. В сковороде соединить чечевицу, томат, кокосовое молоко, воду и карри; прогреть 5–7 минут. Добавить шпинат, затем лимон. Подать с кускусом. Часть кокосового молока заменена водой, чтобы соус не был излишне тяжёлым. Аллерген: пшеница; состав смеси карри проверить.<\/p>", "ingredientList": ["чечевица 350 г", "томатная основа К 150 г", "кокосовое молоко 100 мл", "вода 100 мл", "шпинат 150 г", "карри 1 ч. л", "сухой кускус 100 г", "лимонный сок 10 мл"], "refs": [], "baseIds": ["b4"]}, {"id": "r16", "code": "16", "name": "Тёплая чечевица с печёными овощами", "time": "10–12 минут", "body": "Чечевицу и овощи прогреть вместе под крышкой с 2–3 ст. л. воды. Разложить по тарелкам, добавить свежий огурец, петрушку, соус и семечки. При желании подать хлеб. Отличие от карри — отдельные текстуры, лимонно-кунжутный соус и свежий хруст. Аллерген: кунжут.", "ingredients": "чечевица 350 г; печёные овощи Е 350 г; соус С3 60 г; огурец 200 г; петрушка 15 г; тыквенные семечки 15 г.", "kind": "recipe", "base": "b4", "raw": "чечевица 350 г; печёные овощи Е 350 г; соус С3 60 г; огурец 200 г; петрушка 15 г; тыквенные семечки 15 г.\nЧечевицу и овощи прогреть вместе под крышкой с 2–3 ст. л. воды. Разложить по тарелкам, добавить свежий огурец, петрушку, соус и семечки. При желании подать хлеб. Отличие от карри — отдельные текстуры, лимонно-кунжутный соус и свежий хруст. Аллерген: кунжут.", "html": "<p>Чечевицу и овощи прогреть вместе под крышкой с 2–3 ст. л. воды. Разложить по тарелкам, добавить свежий огурец, петрушку, соус и семечки. При желании подать хлеб. Отличие от карри — отдельные текстуры, лимонно-кунжутный соус и свежий хруст. Аллерген: кунжут.<\/p>", "ingredientList": ["чечевица 350 г", "печёные овощи Е 350 г", "соус С3 60 г", "огурец 200 г", "петрушка 15 г", "тыквенные семечки 15 г"], "refs": [], "baseIds": ["b4"]}], "svg": "\n\n<svg width=\"160\" height=\"160\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 160 160\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\t<title>...<\/title>\n\t<des . Аллергены: молоко, пшеница при подаче хлеба.", "ingredients": "нут 360 г; помидоры 250 г; огурец 250 г; фета 70 г; оливки 30 г; оливковое масло 10 г; лимонный сок 15 мл; орегано ½ ч. л.; хлеб 100 г по аппетиту.", "kind": "salad", "base": "b5", "raw": "нут 360 г; помидоры 250 г; огурец 250 г; фета 70 г; оливки 30 г; оливковое масло 10 г; лимонный сок 15 мл; орегано ½ ч. л.; хлеб 100 г по аппетиту.\nОвощи нарезать крупно, соединить с нутом, оливками и фетой. Заправить маслом, лимоном и орегано. Посолить только после пробы. Хлеб подать отдельно. Нут здесь остаётся целым и холодным, что отличает блюдо от сэндвича и горячей лапши. Аллергены: молоко, пшеница при подаче хлеба.", "html": "<p>Овощи нарезать крупно, соединить с нутом, оливками и фетой. Заправить маслом, лимоном и орегано. Посолить только после пробы. Хлеб подать отдельно. Нут здесь остаётся целым и холодным, что отличает блюдо от сэндвича и горячей лапши. Аллергены: молоко, пшеница при подаче хлеба.<\/p>", "ingredientList": ["нут 360 г", "помидоры 250 г", "огурец 250 г", "фета 70 г", "оливки 30 г", "оливковое масло 10 г", "лимонный сок 15 мл", "орегано ½ ч. л", "хлеб 100 г по аппетиту"], "refs": [], "baseIds": ["b5"]}, {"id": "r20", "code": "20", "name": "Томатный нут со шпинатом на тостах", "time": "12–15 минут", "body": "Прогреть нут в томате с 50–80 мл воды и паприкой, несколько ложек нута размять для густоты. Добавить шпинат и довести до полного прогрева. Хлеб подсушить, слегка смазать маслом. Выложить нут на тосты непосредственно перед подачей. Аллерген: пшеница.", "ingredients": "нут 360 г; томатная основа К 250 г; шпинат 150 г; хлеб 140 г; копчёная паприка ½ ч. л.; масло 5 г.", "kind": "recipe", "base": "b5", "raw": "нут 360 г; томатная основа К 250 г; шпинат 150 г; хлеб 140 г; копчёная паприка ½ ч. л.; масло 5 г.\nПрогреть нут в томате с 50–80 мл воды и паприкой, несколько ложек нута размять для густоты. Добавить шпинат и довести до полного прогрева. Хлеб подсушить, слегка смазать маслом. Выложить нут на тосты непосредственно перед подачей. Аллерген: пшеница.", "html": "<p>Прогреть нут в томате с 50–80 мл воды и паприкой, несколько ложек нута размять для густоты. Добавить шпинат и довести до полного прогрева. Хлеб подсушить, слегка смазать маслом. Выложить нут на тосты непосредственно перед подачей. Аллерген: пшеница.<\/p>", "ingredientList": ["нут 360 г", "томатная основа К 250 г", "шпинат 150 г", "хлеб 140 г", "копчёная паприка ½ ч. л", "масло 5 г"], "refs": [], "baseIds": ["b5"]}, {"id": "n15", "code": "54", "name": "Зелёное карри: одна овощная база", "time": "20–25 минут", "ingredients": "брокколи 200 г; стручковая фасоль 150 г; горошек 100 г; кокосовое молоко 150 мл; вода 150 мл; карри 1 ч. л.; чеснок 1 зубчик; масло 5 г; нут 300 г или готовая птица 300 г; кускус сухой 100 г", "body": "Прогреть чеснок и карри в масле, добавить овощи, кокосовое молоко и воду. Тушить до готовности овощей. Если часть соуса нужна для другого блюда, отложить её сейчас чистым прибором. В выбранную порцию добавить нут или готовую птицу и тщательно прогреть. Кускус приготовить отдельно. Для хранения быстро охладить; до 48 часов либо заморозить. Аллерген: пшеница; проверить специи.", "source": "План, с. 11, 15", "refs": ["b1", "b5"], "kind": "recipe", "servings": "На двоих", "html": "<p>Прогреть чеснок и карри в масле, добавить овощи, кокосовое молоко и воду. Тушить до готовности овощей. Если часть соуса нужна для другого блюда, отложить её сейчас чистым прибором. В выбранную порцию добавить нут или готовую птицу и тщательно прогреть. Кускус приготовить отдельно. Для хранения быстро охладить; до 48 часов либо заморозить. Аллерген: пшеница; проверить специи.<\/p>", "raw": "брокколи 200 г; стручковая фасоль 150 г; горошек 100 г; кокосовое молоко 150 мл; вода 150 мл; карри 1 ч. л.; чеснок 1 зубчик; масло 5 г; нут 300 г или готовая птица 300 г; кускус сухой 100 г\nПрогреть чеснок и карри в масле, добавить овощи, кокосовое молоко и воду. Тушить до готовности овощей. Если часть соуса ну />\n\t\t\t<ellipse cx=\"79.69177499174822\" cy=\"40.84341267835486\" rx=\"7.0\" ry=\"5.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(84%,72%,45%); fill-rule: evenodd;\"/>\n\t\t<\/g>\n\t<\/g>\n<\/svg>\n", "iconIndex": 4}, {"id": "b6", "letter": "Е", "name": "Противень печёных овощей", "short": "Печёные овощи", "role": "Овощной компонент", "color": "#E2EACE", "intro": "**Сырьё:** кабачок 500 г; сладкий перец 400 г; морковь 300 г; лук 300 г; масло 25 г; соль. **Выход:** примерно 1,1–1,2 кг. **Работа:** 15–20 минут активно, 45–55 минут с нагревом духовки.\n\nМорковь нарезать тоньше, кабачок и перец — кусками около 2 см, лук — дольками. Смешать с маслом, разложить в один слой на двух противнях или готовить партиями. Запекать при 210 °C около 25–35 минут после нагрева духовки, один раз перемешать; готовые овощи снимать раньше, если разные виды готовятся неравномерно.\n\nХранение: до 48 часов. Замораживать можно, но кабачок станет мягче; размороженный вариант лучше использовать в супе, омлете или соусе. В плотной куче овощи преимущественно тушатся, поэтому не увеличивать объём без увеличения площади противня.", "html": "<p><strong>Сырьё:<\/strong> кабачок 500 г; сладкий перец 400 г; морковь 300 г; лук 300 г; масло 25 г; соль. <strong>Выход:<\/strong> примерно 1,1–1,2 кг. <strong>Работа:<\/strong> 15–20 минут активно, 45–55 минут с нагревом духовки.<\/p>\n<p>Морковь нарезать тоньше, кабачок и перец — кусками около 2 см, лук — дольками. Смешать с маслом, разложить в один слой на двух противнях или готовить партиями. Запекать при 210 °C около 25–35 минут после нагрева духовки, один раз перемешать; готовые овощи снимать раньше, если разные виды готовятся неравномерно.<\/p>\n<p>Хранение: до 48 часов. Замораживать можно, но кабачок станет мягче; размороженный вариант лучше использовать в супе, омлете или соусе. В плотной куче овощи преимущественно тушатся, поэтому не увеличивать объём без увеличения площади противня.<\/p>", "recipes": [{"id": "r21", "code": "21", "name": "Овощной омлет на сковороде", "time": "12–15 минут", "body": "Овощи прогреть на сковороде. Яйца смешать с молоком, залить овощи, посыпать сыром. Готовить на небольшом огне под крышкой примерно 7–10 минут до полного схватывания; для блюда с разогреваемыми компонентами проверить 74 °C в центре. Подать с хлебом и огурцом. Аллергены: яйца, молоко, пшеница.", "ingredients": "овощи 300 г; 4 яйца; молоко 50 мл; сыр 30 г; масло 5 г; хлеб 100 г; огурец 200 г.", "kind": "recipe", "base": "b6", "raw": "овощи 300 г; 4 яйца; молоко 50 мл; сыр 30 г; масло 5 г; хлеб 100 г; огурец 200 г.\nОвощи прогреть на сковороде. Яйца смешать с молоком, залить овощи, посыпать сыром. Готовить на небольшом огне под крышкой примерно 7–10 минут до полного схватывания; для блюда с разогреваемыми компонентами проверить 74 °C в центре. Подать с хлебом и огурцом. Аллергены: яйца, молоко, пшеница.", "html": "<p>Овощи прогреть на сковороде. Яйца смешать с молоком, залить овощи, посыпать сыром. Готовить на небольшом огне под крышкой примерно 7–10 минут до полного схватывания; для блюда с разогреваемыми компонентами проверить 74 °C в центре. Подать с хлебом и огурцом. Аллергены: яйца, молоко, пшеница.<\/p>", "ingredientList": ["овощи 300 г", "4 яйца", "молоко 50 мл", "сыр 30 г", "масло 5 г", "хлеб 100 г", "огурец 200 г"], "refs": [], "baseIds": ["b6"]}, {"id": "r22", "code": "22", "name": "Ролл с печёными овощами и нутовым кремом", "time": "10–12 минут", "body": "Нут размять или измельчить с тахини, лимоном и водой. Овощи прогреть, капусту тонко нашинковать. Лепёшки смазать нутовым кремом, добавить овощи и капусту, свернуть. Подсушить на сковороде по желанию. Готовый хумус можно взять вместо самостоятельного крема, сверив соль и состав. Аллергены: кунжут, пшеница.", "ingredients": "овощи 350 г; нут Д 300 г; тахини 20 г; лимонный сок 15 мл; вода 40–60 мл; 2 больших лаваша/тортильи; капуста 200 г.", "kind": "recipe", "base": "b6", "raw": "овощи 350 г; нут Д 300 г; тахини 20 г; лимонный "<p>Овощи и фасоль залить жидкостью, довести до кипения и прогреть 5–7 минут. Снять с огня и измельчить погружным блендером, не разбрызгивая горячую жидкость. При необходимости добавить воды, вернуть к кипению. Добавить лимон и масло; подать с тостами. Фасоль даёт кремовую текстуру без обязательных сливок. Аллергены: пшеница в хлебе; состав бульона.<\/p>", "ingredientList": ["овощи 400 г", "консервированная белая фасоль 300 г", "вода или бульон 500 мл", "лимонный сок 10 мл", "масло 5 г", "хлеб 100 г"], "refs": [], "baseIds": ["b6", "p2"]}, {"id": "r24", "code": "24", "name": "Кускус с овощами и жареным сыром", "time": "12–15 минут", "body": "Приготовить кускус по упаковке. Сыр нарезать пластинками и обжарить на антипригарной сковороде по 2–3 минуты с каждой стороны; адыгейский сыр переворачивать аккуратно. Овощи прогреть отдельно, смешать с кускусом, сверху положить сыр и свежие помидоры. Заправить зелёным соусом. Аллергены: пшеница, молоко.", "ingredients": "овощи 350 г; сухой кускус 120 г; халуми или плотный адыгейский сыр 160 г; соус С5 30 г; помидоры 250 г.", "kind": "recipe", "base": "b6", "raw": "овощи 350 г; сухой кускус 120 г; халуми или плотный адыгейский сыр 160 г; соус С5 30 г; помидоры 250 г.\nПриготовить кускус по упаковке. Сыр нарезать пластинками и обжарить на антипригарной сковороде по 2–3 минуты с каждой стороны; адыгейский сыр переворачивать аккуратно. Овощи прогреть отдельно, смешать с кускусом, сверху положить сыр и свежие помидоры. Заправить зелёным соусом. Аллергены: пшеница, молоко.", "html": "<p>Приготовить кускус по упаковке. Сыр нарезать пластинками и обжарить на антипригарной сковороде по 2–3 минуты с каждой стороны; адыгейский сыр переворачивать аккуратно. Овощи прогреть отдельно, смешать с кускусом, сверху положить сыр и свежие помидоры. Заправить зелёным соусом. Аллергены: пшеница, молоко.<\/p>", "ingredientList": ["овощи 350 г", "сухой кускус 120 г", "халуми или плотный адыгейский сыр 160 г", "соус С5 30 г", "помидоры 250 г"], "refs": [], "baseIds": ["b6"]}, {"id": "n04", "code": "44", "name": "Тёплый фасолевый дип к печёным овощам", "time": "10–12 минут", "ingredients": "основа М 350 г; овощи Е 400 г; вода 40–70 мл; паприка ½ ч. л.; хлеб 100 г по аппетиту", "body": "Измельчить фасоль с водой, прогреть с паприкой до 74 °C. Овощи разогреть отдельно, хлеб подсушить. Подать дип в миске, а овощи и хлеб рядом. Количество воды подбирать по густоте основы. Аллергены: пшеница при подаче хлеба; молоко при сырной корке.", "source": "Клетчатка, с. 10", "refs": ["p2", "b6"], "kind": "recipe", "servings": "На двоих", "html": "<p>Измельчить фасоль с водой, прогреть с паприкой до 74 °C. Овощи разогреть отдельно, хлеб подсушить. Подать дип в миске, а овощи и хлеб рядом. Количество воды подбирать по густоте основы. Аллергены: пшеница при подаче хлеба; молоко при сырной корке.<\/p>", "raw": "основа М 350 г; овощи Е 400 г; вода 40–70 мл; паприка ½ ч. л.; хлеб 100 г по аппетиту\nИзмельчить фасоль с водой, прогреть с паприкой до 74 °C. Овощи разогреть отдельно, хлеб подсушить. Подать дип в миске, а овощи и хлеб рядом. Количество воды подбирать по густоте основы. Аллергены: пшеница при подаче хлеба; молоко при сырной корке.", "ingredientList": ["основа М 350 г", "овощи Е 400 г", "вода 40–70 мл", "паприка ½ ч. л", "хлеб 100 г по аппетиту"], "base": "p2", "baseIds": ["p2", "b6"]}, {"id": "n11", "code": "50", "name": "Тыквенный суп с креветками", "time": "12–15 минут", "ingredients": "печёная тыква 400 г; печёный лук из Е 80 г; вода или бульон 500 мл; сырые очищенные размороженные креветки 250 г; масло 5 г; чеснок 1 зубчик; йогурт 60 г; хлеб 100 г", "body": "Тыкву и лук прогреть с жидкостью, измельчить, вернуть к кипению. Креветки обжарить отдельно с маслом и чесноком до непрозрачной мякоти и готовности по инструкции, обычно 4–6 минут. Добавить в тарелку с супом, йогуртом и тостом. Время предполагает уже запечённые овощи. Аллергены: ракообразные, молоко, пшеница; состав бульона.", "source": "План, с. 14", "refs": ["b6"], "kind": "recipe", "servings": "На двоих", "html": "<p>Тыкву и лук прогреть с жидкостью, измельчить, вернуть к кипению. Креветки обжарить отдельно с маслом и чесноком до непрозрачной мякоти и готовности по инструкции, обычно 4–6 минут. Добавить в тарелку с супом, йогуртом и тостом. Время предполагает уже запечённые овощи. Аллергены: ракообразные, молоко, пшеница; состав бульона.<\/p>", "raw": "печёная тыква 400 г; печёный лук из Е 80 г; вода или бульон 500 мл; сырые очищенные размороженные креветки 250 г; масло 5 г; чеснок 1 зубчик; йогурт 60 г; хлеб 100 г\nТыкву и лук прогреть с жидкостью, измельчить, вернуть к кипению. Креветки обжарить отдельно с маслом и чесноком до непрозрачной мякоти и готовности по инструкции, обычно 4–6 минут. Добавить в тарелку с супом, йогуртом и тостом. Время предполагает уже запечённые овощи. Аллергены: ракообразные, молоко, пшеница; состав бульона.", "ingredientList": ["печёная тыква 400 г", "печёный лук из Е 80 г", "вода или бульон 500 мл", "сырые очищенные размороженные креветки 250 г", "масло 5 г", "чеснок 1 зубчик", "йогурт 60 г", "хлеб 100 г"], "base": "b6", "baseIds": ["b6"]}, {"id": "n19", "code": "58", "name": "Ролл с тыквой, халуми и зеленью", "time": "12–15 минут", "ingredients": "печёная тыква или овощи Е 300 г; халуми 150 г; готовые небольшие лепёшки 57 4 шт. или 2 большие тортильи; йогурт 80 г; лимонный сок 10 мл; зелень 20 г; огурец 200 г", "body": "Сыр обжарить по 2–3 минуты с двух сторон, овощи тщательно разогреть. Йогурт смешать с лимоном. Согреть лепёшки, наполнить овощами, сыром, огурцом и зеленью, добавить соус. Вариант — заменить сыр готовыми креветками; сырые креветки предварительно полностью приготовить. Аллергены: молоко, пшеница; при замене — ракообразные.", "source": "План, с. 15", "refs": ["b6", "n18"], "kind": "recipe", "servings": "На двоих", "html": "<p>Сыр обжарить по 2–3 минуты с двух сторон, овощи тщательно разогреть. Йогурт смешать с лимоном. Согреть лепёшки, наполнить овощами, сыром, огурцом и зеленью, добавить соус. Вариант — заменить сыр готовыми креветками; сырые креветки предварительно полностью приготовить. Аллергены: молоко, пшеница; при замене — ракообразные.<\/p>", "raw": "печёная тыква или овощи Е 300 г; халуми 150 г; готовые небольшие лепёшки 57 4 шт. или 2 большие тортильи; йогурт 80 г; лимонный сок 10 мл; зелень 20 г; огурец 200 г\nСыр обжарить по 2–3 минуты с двух сторон, овощи тщательно разогреть. Йогурт смешать с лимоном. Согреть лепёшки, наполнить овощами, сыром, огурцом и зеленью, добавить соус. Вариант — заменить сыр готовыми креветками; сырые креветки предварительно полностью приготовить. Аллергены: молоко, пшеница; при замене — ракообразные.", "ingredientList": ["печёная тыква или овощи Е 300 г", "халуми 150 г", "готовые небольшие лепёшки 57 4 шт. или 2 большие тортильи", "йогурт 80 г", "лимонный сок 10 мл", "зелень 20 г", "огурец 200 г"], "base": "b6", "baseIds": ["b6"]}, {"id": "l4", "code": "62", "name": "Тыква с зеленью и семечками", "time": "5–10 минут из готовых компонентов", "ingredients": "печёная тыква 300 г; шпинат или руккола 60 г; тыквенные семечки 20 г; бальзамический уксус 10 мл; масло 5 г", "body": "Тыкву подать охлаждённой при правильном хранении либо разогреть отдельно. Добавить листья, семечки и заправку непосредственно перед едой.", "source": "План, с. 19", "refs": [], "kind": "salad", "servings": "На двоих, салат-дополнение", "html": "<p>Тыкву подать охлаждённой при правильном хранении либо разогреть отдельно. Добавить листья, семечки и заправку непосредственно перед едой.<\/p>", "raw": "печёная тыква 300 г; шпинат или руккола 60 г; тыквенные семечки 20 г; бальзамический уксус 10 мл; масло 5 г\nТыкву подать охлаждённой при правильном хранении либо разогреть отдельно. Добавить листья, семечки и заправку непосредственно перед едой.", "ingredientList": ["печёная тыква 300 г", "шпинат или руккола 60 г", "тыквенные семечки 20 г", "бальзамический уксус 10 мл", "масло 5 г"], "base": "b6", "baseIds": ["b6"]}], "svg": "\n\n<svg widt %,58%,32%); fill-rule: evenodd;\"/>\n\t\t\t<rect x=\"78\" y=\"49\" width=\"14\" height=\"30\" rx=\"5\" ry=\"5\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(86%,58%,32%); fill-rule: evenodd;\"/>\n\t\t\t<rect x=\"101\" y=\"41\" width=\"14\" height=\"30\" rx=\"5\" ry=\"5\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(86%,58%,32%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"44.0\" cy=\"77.0\" rx=\"15.0\" ry=\"6.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(74%,40%,28%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"99.0\" cy=\"78.0\" rx=\"15.0\" ry=\"6.0\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(74%,40%,28%); fill-rule: evenodd;\"/>\n\t\t<\/g>\n\t<\/g>\n<\/svg>\n", "iconIndex": 5}, {"id": "b7", "letter": "Ж", "name": "Грибы с луком", "short": "Грибы", "role": "Вкус и текстура", "color": "#EAE2D9", "intro": "**Сырьё:** шампиньоны 800 г; лук 200 г; масло 20 г; соль, перец. **Выход:** около 600–700 г. **Работа:** примерно 20–25 минут активно; 25–35 минут всего.\n\nГрибы нарезать, быстро обжарить партиями, чтобы влага испарялась. Лук отдельно довести до мягкости, соединить, посолить. Сливки и сметану пока не добавлять. Хранение: до 48 часов; можно заморозить. Грибы дают вкус и текстуру, а источник белка добавляется в каждое блюдо отдельно.", "html": "<p><strong>Сырьё:<\/strong> шампиньоны 800 г; лук 200 г; масло 20 г; соль, перец. <strong>Выход:<\/strong> около 600–700 г. <strong>Работа:<\/strong> примерно 20–25 минут активно; 25–35 минут всего.<\/p>\n<p>Грибы нарезать, быстро обжарить партиями, чтобы влага испарялась. Лук отдельно довести до мягкости, соединить, посолить. Сливки и сметану пока не добавлять. Хранение: до 48 часов; можно заморозить. Грибы дают вкус и текстуру, а источник белка добавляется в каждое блюдо отдельно.<\/p>", "recipes": [{"id": "r25", "code": "25", "name": "Гречка с грибами и яйцами", "time": "10–12 минут", "body": "Грибы и гречку прогреть с 40–60 мл воды под крышкой. На второй сковороде приготовить яйца с маслом до желаемой безопасной степени готовности; в учебном базовом варианте белок и желток полностью схватившиеся. Подать с зеленью и нарезанными овощами. Аллерген: яйца.", "ingredients": "грибы 250 г; готовая гречка 350 г; 4 яйца; масло 5 г; укроп 10 г; огурец и помидоры 300 г суммарно.", "kind": "recipe", "base": "b7", "raw": "грибы 250 г; готовая гречка 350 г; 4 яйца; масло 5 г; укроп 10 г; огурец и помидоры 300 г суммарно.\nГрибы и гречку прогреть с 40–60 мл воды под крышкой. На второй сковороде приготовить яйца с маслом до желаемой безопасной степени готовности; в учебном базовом варианте белок и желток полностью схватившиеся. Подать с зеленью и нарезанными овощами. Аллерген: яйца.", "html": "<p>Грибы и гречку прогреть с 40–60 мл воды под крышкой. На второй сковороде приготовить яйца с маслом до желаемой безопасной степени готовности; в учебном базовом варианте белок и желток полностью схватившиеся. Подать с зеленью и нарезанными овощами. Аллерген: яйца.<\/p>", "ingredientList": ["грибы 250 г", "готовая гречка 350 г", "4 яйца", "масло 5 г", "укроп 10 г", "огурец и помидоры 300 г суммарно"], "refs": [], "baseIds": ["b7"]}, {"id": "r26", "code": "26", "name": "Грибной соус с белой фасолью", "time": "12–15 минут", "body": "Прогреть грибы с фасолью и водой, затем вмешать сметану и горчицу. Несколько фасолин размять для густоты и полностью прогреть блюдо. Крупу разогреть отдельно. Подать с тонко нашинкованной капустой. Аллергены: молоко, горчица; пшеница при использовании булгура.", "ingredients": "грибы 250 г; белая фасоль 300 г; сметана 15% 80 г; вода 100 мл; горчица 5 г; готовый булгур или гречка 250 г; капуста 200 г.", "kind": "recipe", "base": "b7", "raw": "грибы 250 г; белая фасоль 300 г; сметана 15% 80 г; вода 100 мл; горчица 5 г; готовый булгур или гречка 250 г; капуста 200 г.\nПрогреть грибы с фасолью и водой, затем вмешать сметану и горчицу. Несколько фасолин размять для густоты и полностью прогреть блюдо. Крупу разогреть отдельно. Подать с тонко нашинкованной капустой. Аллергены: молоко, горчица; пшеница при использовании булгура.", "html": "<p>Прогреть грибы с фасолью и водой, затем вмешать сметану и горчицу. Несколько фасолин размять для густоты и полностью прогреть блюдо. Крупу разогреть отдельно. Подать с тонко нашинкованной капустой. Аллергены: молоко, горчица; пшеница при использовании булгура.<\/p>", "ingredientList": ["грибы 250 г", "белая фасоль 300 г", "сметана 15% 80 г", "вода 100 мл", "горчица 5 г", "готовый булгур или гречка 250 г", "капуста 200 г"], "refs": [], "baseIds": ["b7", "p2"]}, {"id": "r27", "code": "27", "name": "Грибной омлет с зеленью", "time": "10–12 минут", "body": "Прогреть грибы, добавить шпинат. Яйца смешать с молоком, вылить на сковороду и готовить под крышкой до схватывания и полного прогрева основы. Подать с подсушенным хлебом и помидорами. Отличие от гречки — грибы становятся начинкой, а не гарниром. Аллергены: яйца, молоко, пшеница.", "ingredients": "грибы 200 г; 4 яйца; молоко 40 мл; шпинат 100 г; хлеб 100 г; помидоры 250 г; масло 5 г.", "kind": "recipe", "base": "b7", "raw": "грибы 200 г; 4 яйца; молоко 40 мл; шпинат 100 г; хлеб 100 г; помидоры 250 г; масло 5 г.\nПрогреть грибы, добавить шпинат. Яйца смешать с молоком, вылить на сковороду и готовить под крышкой до схватывания и полного прогрева основы. Подать с подсушенным хлебом и помидорами. Отличие от гречки — грибы становятся начинкой, а не гарниром. Аллергены: яйца, молоко, пшеница.", "html": "<p>Прогреть грибы, добавить шпинат. Яйца смешать с молоком, вылить на сковороду и готовить под крышкой до схватывания и полного прогрева основы. Подать с подсушенным хлебом и помидорами. Отличие от гречки — грибы становятся начинкой, а не гарниром. Аллергены: яйца, молоко, пшеница.<\/p>", "ingredientList": ["грибы 200 г", "4 яйца", "молоко 40 мл", "шпинат 100 г", "хлеб 100 г", "помидоры 250 г", "масло 5 г"], "refs": [], "baseIds": ["b7"]}, {"id": "r28", "code": ми одинаковыми кусками, отварить до мягкости. Для блюда № 12 можно отварить некрупные клубни целиком. Слить воду, дать выйти лишнему пару, быстро охладить порционно и убрать в холодильник. Хранение: до 48 часов. Для этой подборки заморозка необязательна: текстура отдельных сортов после неё заметно ухудшается. Картофель считается сытной основой; овощи к нему добавляются отдельно.", "html": "<p><strong>Сырьё:<\/strong> картофель 1,2 кг, соль. <strong>Выход:<\/strong> около 1,1–1,2 кг. <strong>Работа:<\/strong> 10 минут активно; 25–40 минут всего в зависимости от размера.<\/p>\n<p>Для быстроты очистить и нарезать крупными одинаковыми кусками, отварить до мягкости. Для блюда № 12 можно отварить некрупные клубни целиком. Слить воду, дать выйти лишнему пару, быстро охладить порционно и убрать в холодильник. Хранение: до 48 часов. Для этой подборки заморозка необязательна: текстура отдельных сортов после неё заметно ухудшается. Картофель считается сытной основой; овощи к нему добавляются отдельно.<\/p>", "recipes": [{"id": "r29", "code": "29", "name": "Тёплый картофельный салат с тунцом", "time": "10–12 минут", "body": "Фасоль приготовить по упаковке, обычно 5–7 минут. Картофель разрезать и разогреть, тунец разобрать на кусочки. Смешать с фасолью, помидорами, зеленью и заправкой. Подача тёплая; тунец из только что открытой банки дополнительно варить не требуется. Аллергены: рыба, горчица.", "ingredients": "картофель 450 г; консервированный тунец 200 г без жидкости; стручковая фасоль 250 г; горчичная заправка С2 40 г; помидоры 200 г; зелень 15 г.", "kind": "salad", "base": "b8", "raw": "картофель 450 г; консервированный тунец 200 г без жидкости; стручковая фасоль 250 г; горчичная заправка С2 40 г; помидоры 200 г; зелень 15 г.\nФасоль приготовить по упаковке, обычно 5–7 минут. Картофель разрезать и разогреть, тунец разобрать на кусочки. Смешать с фасолью, помидорами, зеленью и заправкой. Подача тёплая; тунец из только что открытой банки дополнительно варить не требуется. Аллергены: рыба, горчица.", "html": "<p>Фасоль приготовить по упаковке, обычно 5–7 минут. Картофель разрезать и разогреть, тунец разобрать на кусочки. Смешать с фасолью, помидорами, зеленью и заправкой. Подача тёплая; тунец из только что открытой банки дополнительно варить не требуется. Аллергены: рыба, горчица.<\/p>", "ingredientList": ["картофель 450 г", "консервированный тунец 200 г без жидкости", "стручковая фасоль 250 г", "горчичная заправка С2 40 г", "помидоры 200 г", "зелень 15 г"], "refs": [], "baseIds": ["b8"]}, {"id": "r30", "code": "30", "name": "Картофель с фасолью и яйцами на сковороде", "time": "12–15 минут", "body": "Фасоль готовить с 50 мл воды под крышкой около 4–5 минут или по упаковке. Выпарить лишнюю воду, добавить масло и нарезанный картофель; подрумянить 3–4 минуты. Сделать углубления, разбить яйца и довести под крышкой до схватывания. Подать с помидорами. Если крупные куски картофеля ещё холодные, сначала разогреть их отдельно. Аллерген: яйца.", "ingredients": "картофель 500 г; замороженная стручковая фасоль 250 г; 4 яйца; масло 10 г; паприка ½ ч. л.; помидоры 200 г.", "kind": "recipe", "base": "b8", "raw": "картофель 500 г; замороженная стручковая фасоль 250 г; 4 яйца; масло 10 г; паприка ½ ч. л.; помидоры 200 г.\nФасоль готовить с 50 мл воды под крышкой около 4–5 минут или по упаковке. Выпарить лишнюю воду, добавить масло и нарезанный картофель; подрумянить 3–4 минуты. Сделать углубления, разбить яйца и довести под крышкой до схватывания. Подать с помидорами. Если крупные куски картофеля ещё холодные, сначала разогреть их отдельно. Аллерген: яйца.", "html": "<p>Фасоль готовить с 50 мл воды под крышкой около 4–5 минут или по упаковке. Выпарить лишнюю воду, добавить масло и нарезанный картофель; подрумянить 3–4 минуты. Сделать углубления, разбить яйца и довести под крышкой до схватывания. Подать с помидорами. Если крупные куски картофеля ещё холодные, сначала разогреть их отдельно. Аллерген: яйца.<\/p>", "ingredientList": ["картофель 500 г", "замороженная стручковая фасоль 250 г", "4 яйца", "масло 10 г", "паприка ½ ч. л", "помидоры 200 г"], "refs": [], "baseIds": ["b8"]}, {"id": "r31", "code": "31", "name": "Хрустящий картофель с фасолью и йогуртом", "time": "12–15 минут", "body": "Картофель нарезать ломтиками толщиной около 1 см, обжарить на большой сковороде с маслом примерно по 3–4 минуты с каждой стороны. Фасоль прогреть отдельно с паприкой и ложкой воды. Подать вместе с соусом и свежими овощами. Не складывать картофель в несколько слоёв: иначе он будет мягким и время увеличится. Аллерген: молоко.", "ingredients": "картофель 450 г; белая фасоль 300 г; соус С1 100 г; масло 10 г; огурец 200 г; капуста 200 г; паприка ½ ч. л.", "kind": "recipe", "base": "b8", "raw": "картофель 450 г; белая фасоль 300 г; соус С1 100 г; масло 10 г; огурец 200 г; капуста 200 г; паприка ½ ч. л.\nКартофель нарезать ломтиками толщиной около 1 см, обжарить на большой сковороде с маслом примерно по 3–4 минуты с каждой стороны. Фасоль прогреть отдельно с паприкой и ложкой воды. Подать вместе с соусом и свежими овощами. Не складывать картофель в несколько слоёв: иначе он будет мягким и время увеличится. Аллерген: молоко.", "html": "<p>Картофель нарезать ломтиками толщиной около 1 см, обжарить на большой сковороде с маслом примерно по 3–4 минуты с каждой стороны. Фасоль прогреть отдельно с паприкой и ложкой воды. Подать вместе с соусом и свежими овощами. Не складывать картофель в несколько слоёв: иначе он будет мягким и время увеличится. Аллерген: молоко.<\/p>", "ingredientList": ["картофель 450 г", "белая фасоль 300 г", "соус С1 100 г", "масло 10 г", "огурец 200 г", "капуста 200 г", "паприка ½ ч. л"], "refs": [], "baseIds": ["b8"]}, {"id": "r32", "code": "32", "name": "Быстрый рыбный суп с картофелем", "time": "12–15 минут", "body": "Порей тонко нарезать, прогреть с маслом 2 минуты. Добавить кипящую воду и картофель, варить 3 минуты. Рыбу нарезать кубиками около 2 см, добавить вместе с молоком; готовить на слабом кипении до 63 °C в рыбе, обычно ещё 4–6 минут. Посыпать укропом, подать с хлебом. Аллергены: рыба, молоко, пшеница.", "ingredients": "картофель 300 г; сырое размороженное филе рыбы И 300 г; вода или бульон 700 мл; лук-порей 120 г; молоко 150 мл; масло 5 г; укроп 10 г; хлеб 80 г.", "kind": "recipe", "base": "b8", "raw": "картофель 300 г; сырое размороженное филе рыбы И 300 г; вода или бульон 700 мл; лук-порей 120 г; молоко 150 мл; масло 5 г; укроп 10 г; хлеб 80 г.\nПорей тонко нарезать, прогреть с маслом 2 минуты. Добавить кипящую воду и картофель, варить 3 минуты. Рыбу нарезать кубиками около 2 см, добавить вместе с молоком; готовить на слабом кипении до 63 °C в рыбе, обычно ещё 4–6 минут. Посыпать укропом, подать с хлебом. Аллергены: рыба, молоко, пшеница.", "html": "<p>Порей тонко нарезать, прогреть с маслом 2 минуты. Добавить кипящую воду и картофель, варить 3 минуты. Рыбу нарезать кубиками около 2 см, добавить вместе с молоком; готовить на слабом кипении до 63 °C в рыбе, обычно ещё 4–6 минут. Посыпать укропом, подать с хлебом. Аллергены: рыба, молоко, пшеница.<\/p>", "ingredientList": ["картофель 300 г", "сырое размороженное филе рыбы И 300 г", "вода или бульон 700 мл", "лук-порей 120 г", "молоко 150 мл", "масло 5 г", "укроп 10 г", "хлеб 80 г"], "refs": [], "baseIds": ["b8"]}, {"id": "n10", "code": "49", "name": "Треска в томатном соусе с каперсами", "time": "18–22 минуты", "ingredients": "рыбная заготовка И 320 г; томатная основа К 250 г; сладкий перец 150 г; оливки 30 г; каперсы 10 г; масло 5 г; вода 70 мл; картофель З 300 г", "body": "Перец нарезать тонко и прогреть с маслом 3–4 минуты. Добавить томат, воду, оливки и каперсы; довести до кипения. Положить тонкие порции размороженной рыбы, накрыть и готовить до 63 °C в рыбе, обычно 7–10 минут. Картофель разогреть отдельно. Солить после пробы соуса. Аллерген: рыба.", "source": "План, с. 12", "refs": ["b9", "b10", "b8"], "kind": "recipe", "servings": "На двоих", "html": "<p>Перец нарезать тонко и прогреть с маслом 3–4 минуты. Добавить томат, воду, оливки и каперсы; довести до кипения. Положить тонкие порции размороженной рыбы, накрыть и готовить до 63 °C в рыбе, обычно 7–10 минут. Картофель разогреть отдельно. Солить после пробы соуса. Аллерген: рыба.<\/p>", "raw": "рыбная заготовка И 320 г; томатная основа К 250 г; сладкий перец 150 г; оливки 30 г; каперсы 10 г; масло 5 г; вода 70 мл; картофель З 300 г\nПерец нарезать тонко и прогреть с маслом 3–4 минуты. Добавить томат, воду, оливки и каперсы; довести до кипения. Положить тонкие порции размороженной рыбы, накрыть и готовить до 63 °C в рыбе, обычно 7–10 минут. Картофель разогреть отдельно. Солить после пробы соуса. Аллерген: рыба.", "ingredientList": ["рыбная заготовка И 320 г", "томатная основа К 250 г", "сладкий перец 150 г", "оливки 30 г", "каперсы 10 г", "масло 5 г", "вода 70 мл", "картофель З 300 г"], "base": "b9", "baseIds": ["b9", "b10", "b8"]}, {"id": "n14", "code": "53", "name": "Рыба с пюре из цветной капусты", "time": "20–25 минут", "ingredients": "рыбная заготовка И 320 г; цветная капуста 450 г; картофель З 200 г; молоко или бульон 100 мл; масло 10 г; лимонный сок 10 мл; зелень 10 г", "body": "Капусту отварить до мягкости. Добавить разогретый картофель и горячую жидкость, измельчить в пюре. Рыбу обжарить с маслом до 63 °C внутри, подать на пюре с лимоном и зеленью. Картофель — дополнение адаптации для сытности; можно подать его отдельно. Аллергены: рыба, молоко при его использовании.", "source": "План, с. 16", "refs": ["b9", "b8"], "kind": "recipe", "servings": "На двоих", "html": "<p>Капусту отварить до мягкости. Добавить разогретый картофель и горячую жидкость, измельчить в пюре. Рыбу обжарить с маслом до 63 °C внутри, подать на пюре с лимоном и зеленью. Картофель — дополнение адаптации для сытности; можно подать его отдельно. Аллергены: рыба, молоко при его использовании.<\/p>", "raw": "рыбная заготовка И 320 г; цветная капуста 450 г; картофель З 200 г; молоко или бульон 100 мл; масло 10 г; лимонный сок 10 мл; зелень 10 г\nКапу скает это по инструкции. Не мариновать в лимоне на несколько дней.\n\nВ этой системе сырую охлаждённую рыбу используем в течение суток и не позже срока на упаковке. Замороженную порцию заранее размораживаем в холодильнике на поддоне. Для вакуумной упаковки обязательно следовать инструкции по вскрытию перед размораживанием. Отсчёт времени блюд начинается с уже размороженной рыбой. Готовить до 63 °C внутри. Аллерген основы: рыба.", "html": "<p><strong>Сырьё:<\/strong> 900–960 г филе без костей: минтай, треска, форель или другая подходящая рыба. <strong>Выход:<\/strong> три порции по 300–320 г на двоих. <strong>Работа:<\/strong> 10–15 минут; готовится рыба в день подачи.<\/p>\n<p>Разделить филе на небольшие порции толщиной до 2 см или кусочки для конкретного блюда, обсушить, упаковать отдельно. Порцию для ближайшего дня убрать в холодильник; остальные сразу заморозить, если продукт допускает это по инструкции. Не мариновать в лимоне на несколько дней.<\/p>\n<p>В этой системе сырую охлаждённую рыбу используем в течение суток и не позже срока на упаковке. Замороженную порцию заранее размораживаем в холодильнике на поддоне. Для вакуумной упаковки обязательно следовать инструкции по вскрытию перед размораживанием. Отсчёт времени блюд начинается с уже размороженной рыбой. Готовить до 63 °C внутри. Аллерген основы: рыба.<\/p>", "recipes": [{"id": "r33", "code": "33", "name": "Рыба с лимоном, кускусом и салатом", "time": "12–15 минут", "body": "Кускус залить кипятком по упаковке. Небольшие тонкие порции рыбы обжарить с маслом ориентировочно 3–4 минуты с каждой стороны, до 63 °C. Пока рыба готовится, нарезать салат. Лимоном и зеленью дополнить блюдо после готовки. Для толстого стейка время будет больше. Дополнительный аллерген: пшеница.", "ingredients": "рыба 320 г; сухой кускус 140 г; огурец 200 г; помидоры 200 г; масло 10 г; лимонный сок 15 мл; зелень 15 г.", "kind": "recipe", "base": "b9", "raw": "рыба 320 г; сухой кускус 140 г; огурец 200 г; помидоры 200 г; масло 10 г; лимонный сок 15 мл; зелень 15 г.\nКускус залить кипятком по упаковке. Небольшие тонкие порции рыбы обжарить с маслом ориентировочно 3–4 минуты с каждой стороны, до 63 °C. Пока рыба готовится, нарезать салат. Лимоном и зеленью дополнить блюдо после готовки. Для толстого стейка время будет больше. Дополнительный аллерген: пшеница.", "html": "<p>Кускус залить кипятком по упаковке. Небольшие тонкие порции рыбы обжарить с маслом ориентировочно 3–4 минуты с каждой стороны, до 63 °C. Пока рыба готовится, нарезать салат. Лимоном и зеленью дополнить блюдо после готовки. Для толстого стейка время будет больше. Дополнительный аллерген: пшеница.<\/p>", "ingredientList": ["рыба 320 г", "сухой кускус 140 г", "огурец 200 г", "помидоры 200 г", "масло 10 г", "лимонный сок 15 мл", "зелень 15 г"], "refs": [], "baseIds": ["b9"]}, {"id": "r34", "code": "34", "name": "Рыбные тако с капустой", "time": "12–15 минут", "body": "Капусту тонко нашинковать, слегка размять с лимоном. Рыбу небольшими кусочками посыпать паприкой, обжарить до готовности. Тортильи согреть, наполнить рыбой, капустой, помидорами и соусом. Собирать перед едой. Дополнительные аллергены: пшеница в пшеничных тортильях, молоко.", "ingredients": "рыба 320 г; 4 маленькие тортильи; капуста 250 г; помидоры 200 г; соус С1 100 г; паприка ½ ч. л.; масло 10 г; лимонный сок 10 мл.", "kind": "recipe", "base": "b9", "raw": "рыба 320 г; 4 маленькие тортильи; капуста 250 г; помидоры 200 г; соус С1 100 г; паприка ½ ч. л.; масло 10 г; лимонный сок 10 мл.\nКапусту тонко нашинковать, слегка размять с лимоном. Рыбу небольшими кусочками посыпать паприкой, обжарить до готовности. Тортильи согреть, наполнить рыбой, капустой, помидорами и соусом. Собирать перед едой. Дополнительные аллергены: пшеница в пшеничных тортильях, молоко.", "html": "<p>Капусту тонко нашинковать, слегка размять с лимоном. Рыбу небольшими кусочками посыпать паприкой, обжарить до готовности. Тортильи согреть, наполнить рыбой, капустой, помидорами и соусом. Собирать перед едой. Дополнительные аллергены: пшеница в пшеничных тортильях, молоко.<\/p>", "ingredientList": ["рыба 320 г", "4 маленькие тортильи", "капуста 250 г", "помидоры 200 г", "соус С1 100 г", "паприка ½ ч. л", "масло 10 г", "лимонный сок 10 мл"], "refs": [], "baseIds": ["b9", "p1"]}, {"id": "r35", "code": "35", "name": "Рыба в мягком карри с овощами", "time": "12–15 минут", "body": "Приготовить кускус. В широкой сковороде довести до кипения томат, кокосовое молоко, воду и карри. Добавить овощи и рыбу кубиками около 2 см. Тушить на небольшом огне до готовности рыбы и полного прогрева овощей; не перемешивать резко. Добавить лимон. Дополнительный аллерген: пшеница; проверить состав карри.", "ingredients": "рыба 320 г; печёные овощи Е 250 г; томатная основа К 150 г; кокосовое молоко 100 мл; вода 100 мл; карри 1 ч. л.; сухой кускус 100 г; лимон 10 мл сока.", "kind": "recipe", "base": "b9", "raw": "рыба 320 г; печёные овощи Е 250 г; томатная основа К 150 г; кокосовое молоко 100 мл; вода 100 мл; карри 1 ч. л.; сухой кускус 100 г; лимон 10 мл сока.\nПриготовить кускус. В широкой сковороде довести до кипения томат, кокосовое молоко, воду и карри. Добавить овощи и рыбу кубиками около 2 см. Тушить на небольшом огне до готовности рыбы и полного прогрева овощей; не перемешивать резко. Добавить лимон. Дополнительный аллерген: пшеница; проверить состав карри.", "html": "<p>Приготовить кускус. В широкой сковороде довести до кипения томат, кокосовое молоко, воду и карри. Добавить овощи и рыбу кубиками около 2 см. Тушить на небольшом огне до готовности рыбы и полного прогрева овощей; не перемешивать резко. Добавить лимон. Дополнительный аллерген: пшеница; проверить состав карри.<\/p>", "ingredientList": ["рыба 320 г", "печёные овощи Е 250 г", "томатная основа К 150 г", "кокосовое молоко 100 мл", "вода 100 мл", "карри 1 ч. л", "сухой кускус 100 г", "лимон 10 мл сока"], "refs": [], "baseIds": ["b9"]}, {"id": "r36", "code": "36", "name": "Рыба с лапшой и имбирным соусом", "time": "12–15 минут", C внутри, подать на пюре с лимоном и зеленью. Картофель — дополнение адаптации для сытности; можно подать его отдельно. Аллергены: рыба, молоко при его использовании.<\/p>", "raw": "рыбная заготовка И 320 г; цветная капуста 450 г; картофель З 200 г; молоко или бульон 100 мл; масло 10 г; лимонный сок 10 мл; зелень 10 г\nКапусту отварить до мягкости. Добавить разогретый картофель и горячую жидкость, измельчить в пюре. Рыбу обжарить с маслом до 63 °C внутри, подать на пюре с лимоном и зеленью. Картофель — дополнение адаптации для сытности; можно подать его отдельно. Аллергены: рыба, молоко при его использовании.", "ingredientList": ["рыбная заготовка И 320 г", "цветная капуста 450 г", "картофель З 200 г", "молоко или бульон 100 мл", "масло 10 г", "лимонный сок 10 мл", "зелень 10 г"], "base": "b9", "baseIds": ["b9", "b8"]}], "svg": "\n\n<svg width=\"160\" height=\"160\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 160 160\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\t<title>...<\/title>\n\t<desc>...<\/desc>\n\t<clipPath id=\"clip\">\n\t\t<rect x=\"0\" y=\"0\" width=\"160\" height=\"160\"/>\n\t<\/clipPath>\n\t<g id=\"group\" transform=\"scale(1,-1) translate(0,-160)\" style=\"clip-path: url(#clip)\">\n\t\t<g transform=\"\">\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"72\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(86%,91%,90%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"58\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(100%,98%,96%); fill-rule: evenodd;\"/>\n\t\t\t<circle cx=\"80\" cy=\"80\" r=\"50\" style=\"stroke: none; stroke-linecap: butt; stroke-width: 2; fill: rgb(95%,93%,87%); fill-rule: evenodd;\"/>\n\t\t\t<ellipse cx=\"78.0\" cy=\"80.0\" rx=\"37.0\" ry=\"20.0\" style=\"stroke: rgb(14%,29%,23%); stroke-linecap: butt; stroke-width: 2; fill: rgb(57%,71%,69%); fill-rule: evenodd;\"/>\n\t\t\t<polygon points=\"106 егулируя густоту водой. Оставить без ярких специй; по желанию измельчить. Быстро охладить, порционировать по 150–350 г. Хранение: до 48 часов; хорошо замораживается. Это домашняя скоропортящаяся заготовка, не консервация для хранения при комнатной температуре.<\/p>", "recipes": [{"id": "r37", "code": "37", "name": "Шакшука с белой фасолью", "time": "12–15 минут", "body": "В широкой сковороде прогреть основу с фасолью, специями и 40 мл воды. Сделать углубления, вбить яйца; готовить под крышкой на умеренном огне до схватывания белка и желтка. Подать с хлебом и огурцом. Вариант: заменить фасоль 300 г готовой чечевицы. Аллергены: яйца, пшеница.", "ingredients": "томатная основа 350 г; белая фасоль 240 г; 4 яйца; паприка ½ ч. л.; зира ¼ ч. л.; хлеб 100 г; огурец 250 г.", "kind": "recipe", "base": "b10", "raw": "томатная основа 350 г; белая фасоль 240 г; 4 яйца; паприка ½ ч. л.; зира ¼ ч. л.; хлеб 100 г; огурец 250 г.\nВ широкой сковороде прогреть основу с фасолью, специями и 40 мл воды. Сделать углубления, вбить яйца; готовить под крышкой на умеренном огне до схватывания белка и желтка. Подать с хлебом и огурцом. Вариант: заменить фасоль 300 г готовой чечевицы. Аллергены: яйца, пшеница.", "html": "<p>В широкой сковороде прогреть основу с фасолью, специями и 40 мл воды. Сделать углубления, вбить яйца; готовить под крышкой на умеренном огне до схватывания белка и желтка. Подать с хлебом и огурцом. Вариант: заменить фасоль 300 г готовой чечевицы. Аллергены: яйца, пшеница.<\/p>", "ingredientList": ["томатная основа 350 г", "белая фасоль 240 г", "4 яйца", "паприка ½ ч. л", "зира ¼ ч. л", "хлеб 100 г", "огурец 250 г"], "refs": [], "baseIds": ["b10"]}, {"id": "r38", "code": "38", "name": "Быстрый минестроне", "time": "12–15 минут", "body": "Довести томат с кипятком до кипения. Добавить пасту и овощи, варить по времени пасты, затем добавить фасоль и полностью прогреть. Отрегулировать густоту, посыпать зеленью. Если овощной смеси требуется больше времени, добавить её раньше пасты. Аллергены: пшеница; состав бульона.", "ingredients": "томатная основа 300 г; вода или бульон 600 мл; белая фасоль 240 г; замороженная овощная смесь 250 г; мелкая сухая паста с варкой 7–8 минут 70 г; зелень 15 г.", "kind": "recipe", "base": "b10", "raw": "томатная основа 300 г; вода или бульон 600 мл; белая фасоль 240 г; замороженная овощная смесь 250 г; мелкая сухая паста с варкой 7–8 минут 70 г; зелень 15 г.\nДовести томат с кипятком до кипения. Добавить пасту и овощи, варить по времени пасты, затем добавить фасоль и полностью прогреть. Отрегулировать густоту, посыпать зеленью. Если овощной смеси требуется больше времени, добавить её раньше пасты. Аллергены: пшеница; состав бульона.", "html": "<p>Довести томат с кипятком до кипения. Добавить пасту и овощи, варить по времени пасты, затем добавить фасоль и полностью прогреть. Отрегулировать густоту, посыпать зеленью. Если овощной смеси требуется больше времени, добавить её раньше пасты. Аллергены: пшеница; состав бульона.<\/p>", "ingredientList": ["томатная основа 300 г", "вода или бульон 600 мл", "белая фасоль 240 г", "замороженная овощная смесь 250 г", "мелкая сухая паста с варкой 7–8 минут 70 г", "зелень 15 г"], "refs": [], "baseIds": ["b10"]}, {"id": "r39", "code": "39", "name": "Томатный крем-суп с перцем и фасолью", "time": "10–12 минут", "body": "Все компоненты, кроме зелени, масла и хлеба, довести до кипения. Снять с огня, измельчить погружным блендером, регулируя густоту; ещё раз прогреть до кипения. Подать с зеленью, маслом и тостами. Можно взять любой перец из овощной основы, не готовя отдельный противень. Аллерген: пшеница в хлебе.", "ingredients": "томатная основа 350 г; белая фасоль 300 г; печёный перец из основы Е 150 г; вода 300–400 мл; зелень 10 г; масло 5 г; хлеб 100 г.", "kind": "recipe", "base": "b10", "raw": "томатная основа 350 г; белая фасоль 300 г; печёный перец из основы Е 150 г; вода 300–400 мл; зелень 10 г; масло 5 г; хлеб 100 г.\nВсе компоненты, кроме зелени, масла и хлеба, довести до кипения. Снять с огня, измельчить погружным блендером, регулируя густоту; ещё раз прогреть до кипения. Подать с зеленью, маслом и тостами. Можно взять любой перец из овощной основы, не готовя отдельный противень. Аллерген: пшеница в хлебе.", "html": "<p>Все компоненты, кроме зелени, масла и хлеба, довести до кипения. Снять с огня, измельчить погружным блендером, регулируя густоту; ещё раз прогреть до кипения. Подать с зеленью, маслом и тостами. Можно взять любой перец из овощной основы, не готовя отдельный противень. Аллерген: пшеница в хлебе.<\/p>", "ingredientList": ["томатная основа 350 г", "белая фасоль 300 г", "печёный перец из основы Е 150 г", "вода 300–400 мл", "зелень 10 г", "масло 5 г", "хлеб 100 г"], "refs": [], "baseIds": ["b10"]}, {"id": "r40", "code": "40", "name": "Ньокки в томате со шпинатом", "time": "12–15 минут", "body": "Ньокки приготовить по инструкции. Параллельно прогреть томат с водой, добавить шпинат. Соединить с ньокки, сверху распределить моцареллу, накрыть до расплавления сыра. Подать с огурцом. Покупной полуфабрикат здесь — осознанное сокращение работы; домашнее приготовление ньокки не входит в 15 минут. Аллергены: пшеница, молоко, возможны яйца.", "ingredients": "томатная основа 300 г; покупные охлаждённые ньокки 350 г с коротким временем варки; шпинат 150 г; моцарелла 100 г; вода 100 мл; огурец 200 г для подачи.", "kind": "recipe", "base": "b10", "raw": "томатная основа 300 г; покупные охлаждённые ньокки 350 г с коротким временем варки; шпинат 150 г; моцарелла 100 г; вода 100 мл; огурец 200 г для подачи.\nНьокки приготовить по инструкции. Параллельно прогреть томат с водой, добавить шпинат. Соединить с ньокки, сверху распределить моцареллу, накрыть до расплавления сыра. Подать с огурцом. Покупной полуфабрикат здесь — осознанное сокращение работы; домашнее приготовление ньокки не входит в 15 минут. Аллергены: пшеница, молоко, возможны яйца.", "html": "<p>Ньокки приготовить по инструкции. Параллельно прогреть томат с водой, добавить шпинат.
